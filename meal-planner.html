<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel OS — Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #08090b;
  --bg2:    #111318;
  --bg3:    #1a1e26;
  --bd:     #2b3240;
  --bd-lit: #3d4656;
  --tx:     #8b95a8;
  --tx2:    #5c6678;
  --tx3:    #eef2f8;
  --fuel:   #f59e0b;
  --fuel-dim: rgba(245, 158, 11, 0.12);
  --fuel-glow: rgba(245, 158, 11, 0.35);
  --grn:    #4ade80;
  --blu:    #38bdf8;
  --org:    #fb923c;
  --pur:    #c084fc;
  --red:    #f87171;
  --font-display: 'Syne', sans-serif;
  --font: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245,158,11,0.08), transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 50%, rgba(56,189,248,0.04), transparent 50%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer}
#app-shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px 12px;
  border-bottom:1px solid var(--bd);
  background:rgba(17,19,24,0.85);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:50;
}
.logo{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--font-display);font-size:22px;font-weight:800;
  letter-spacing:-0.03em;color:var(--tx3);line-height:1;
}
.logo-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(135deg, var(--fuel) 0%, #d97706 100%);
  color:#0a0a0a;font-size:11px;font-weight:800;letter-spacing:0;
  box-shadow:0 0 20px var(--fuel-glow);
}
.logo-sub{font-family:var(--font);font-size:11px;font-weight:500;color:var(--tx2);letter-spacing:0.06em;text-transform:uppercase}
#hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stat-pill{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  padding:5px 10px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--bd);
  color:var(--tx);white-space:nowrap;
}
.stat-pill strong{color:var(--fuel);font-weight:500}
.stat-pill.streak strong{color:var(--grn)}

#nav{
  display:flex;gap:6px;padding:10px 20px 14px;
  border-bottom:1px solid var(--bd);
  background:rgba(17,19,24,0.6);
  overflow-x:auto;scrollbar-width:none;
}
#nav::-webkit-scrollbar{display:none}
.nb{
  background:transparent;border:1px solid transparent;border-radius:999px;
  color:var(--tx2);font-size:13px;font-weight:500;
  padding:8px 16px;cursor:pointer;white-space:nowrap;
  transition:color .2s var(--ease-out), background .2s var(--ease-out), border-color .2s var(--ease-out), box-shadow .2s;
}
.nb:hover{color:var(--tx3);background:var(--bg3)}
.nb.on{
  color:var(--tx3);background:var(--fuel-dim);
  border-color:rgba(245,158,11,0.35);
  box-shadow:0 0 24px rgba(245,158,11,0.12);
}

#main{max-width:680px;width:100%;margin:0 auto;padding:20px 20px 64px;flex:1}
.screen{display:none;opacity:0}
.screen.on{display:block;animation:screenIn .45s var(--ease-out) forwards}
@keyframes screenIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.panel{
  background:var(--bg2);margin-bottom:22px;
  border:1px solid var(--bd);border-radius:var(--radius);
  padding:18px 20px;
  box-shadow:var(--shadow);
}
.ph{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 0 14px;font-size:11px;color:var(--tx2);
  text-transform:uppercase;letter-spacing:0.08em;font-weight:500;
  border-bottom:1px solid var(--bd);margin-bottom:16px;
}
.ph .pt{
  color:var(--tx3);font-size:12px;font-weight:600;
  font-family:var(--font-display);letter-spacing:0.02em;text-transform:none;
}
.pb{padding:0}

.mrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mlbl{
  width:72px;font-size:11px;font-weight:600;color:var(--tx2);
  text-transform:uppercase;letter-spacing:0.06em;
}
.mbg{
  flex:1;height:8px;background:var(--bg3);border-radius:4px;
  overflow:hidden;position:relative;border:1px solid var(--bd);
}
.mfill{height:100%;transition:width .5s var(--ease-out);max-width:100%;border-radius:3px}
.mfill.plan{opacity:0.28}
.mfill.actual{position:absolute;left:0;top:0;height:100%;box-shadow:0 0 12px currentColor}
.mfill.cal{background:var(--fuel);color:var(--fuel)}
.mfill.pro{background:var(--blu);color:var(--blu)}
.mfill.car{background:var(--org);color:var(--org)}
.mfill.fat{background:var(--pur);color:var(--pur)}
.mfill.over{background:var(--red);color:var(--red)}
.mval{
  width:148px;font-family:var(--font-mono);font-size:10px;
  text-align:right;color:var(--tx2);line-height:1.35;
}
.budget-legend{
  display:flex;justify-content:flex-end;gap:18px;margin-bottom:14px;
  font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:0.06em;
}
.budget-legend .actual-dot,.budget-legend .plan-dot{
  display:inline-block;width:16px;height:3px;margin-right:5px;
  border-radius:2px;vertical-align:middle;
}
.budget-legend .actual-dot{background:var(--fuel);box-shadow:0 0 8px var(--fuel-glow)}
.budget-legend .plan-dot{background:var(--fuel);opacity:0.35}

.dnav{
  display:flex;align-items:center;gap:10px;margin-bottom:24px;
  padding:14px 16px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:var(--radius);
}
.ddisp{
  flex:1;text-align:center;
  font-family:var(--font-display);font-size:17px;font-weight:700;
  color:var(--tx3);letter-spacing:-0.02em;
}
.dsub{
  display:inline-block;font-family:var(--font);font-size:10px;font-weight:600;
  color:var(--fuel);background:var(--fuel-dim);
  border:1px solid rgba(245,158,11,0.3);
  padding:2px 8px;border-radius:999px;margin-left:8px;
  vertical-align:middle;letter-spacing:0.05em;text-transform:uppercase;
}

.mc{
  margin-bottom:16px;padding:16px 18px 14px 20px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);
  border-left:3px solid var(--bd-lit);
  transition:border-color .25s, opacity .25s, box-shadow .25s;
  animation:mealIn .5s var(--ease-out) backwards;
}
.mc:nth-child(1){animation-delay:.04s}
.mc:nth-child(2){animation-delay:.08s}
.mc:nth-child(3){animation-delay:.12s}
.mc:nth-child(4){animation-delay:.16s}
.mc:nth-child(5){animation-delay:.2s}
@keyframes mealIn{
  from{opacity:0;transform:translateX(-8px)}
  to{opacity:1;transform:translateX(0)}
}
.mc.pending{opacity:0.72;border-left-color:var(--tx2)}
.mc.eaten{border-left-color:var(--grn);box-shadow:0 0 0 1px rgba(74,222,128,0.08)}
.mc.eaten .meal-check.on{background:var(--grn);border-color:var(--grn);box-shadow:0 0 12px rgba(74,222,128,0.35)}
.mc.partial{border-left-color:var(--fuel);opacity:0.92}
.mch{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  padding:0 0 12px;border-bottom:1px solid var(--bd);margin-bottom:8px;
}
.mhead-left{display:flex;align-items:center;gap:10px;min-width:140px}
.meal-check{
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--bd-lit);border-radius:5px;
  color:transparent;font-size:11px;line-height:1;flex-shrink:0;
  transition:background .2s, border-color .2s, color .2s, box-shadow .2s;
}
.meal-check:hover{border-color:var(--fuel)}
.meal-check.on{color:#0a0a0a}
.mname{
  background:transparent;border:none;
  font-family:var(--font-display);color:var(--tx3);font-size:16px;font-weight:700;
  width:160px;outline:none;padding:0;letter-spacing:-0.02em;
}
.mc.pending .mname{color:var(--tx)}
.mname:focus{outline:none;box-shadow:0 2px 0 var(--fuel)}
.msum{
  display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--tx2);
}
.msum span{color:var(--tx3);font-weight:500}
.macts{display:flex;gap:6px;align-items:center}
.more-actions{position:relative}
.more-actions summary{list-style:none}
.more-actions summary::-webkit-details-marker{display:none}
.more-menu{
  display:flex;flex-direction:column;gap:4px;position:absolute;right:0;top:32px;z-index:20;
  background:var(--bg2);padding:8px;border-radius:var(--radius-sm);
  border:1px solid var(--bd);box-shadow:var(--shadow);min-width:140px;
}
.mfl{padding:4px 0 0}
.fr{
  display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid rgba(43,50,64,0.5);
  transition:opacity .2s;
}
.fr:last-child{border-bottom:none}
.fr.skipped{opacity:0.4}
.fr.skipped .fname{color:var(--tx2)}
.food-check{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--bd-lit);border-radius:4px;
  color:transparent;font-size:10px;line-height:1;flex-shrink:0;
  transition:all .2s;
}
.food-check:hover{border-color:var(--fuel)}
.food-check.on{border-color:var(--grn);background:var(--grn);color:#0a0a0a}
.food-remove{
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--tx2);font-size:14px;line-height:1;flex-shrink:0;
  border-radius:4px;transition:color .15s, background .15s;
}
.food-remove:hover{color:var(--red);background:rgba(248,113,113,0.1)}
.fname{flex:1;font-size:14px;color:var(--tx3);font-weight:500}
.fqty{display:flex;align-items:center;gap:4px;flex-shrink:0}
.fsrv{
  width:56px;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radius-sm);
  color:var(--tx3);font-family:var(--font-mono);font-size:12px;
  padding:4px 8px;text-align:center;outline:none;
}
.fsrv.amt{width:60px}
.fsrv:focus{border-color:var(--fuel);box-shadow:0 0 0 2px var(--fuel-dim)}
.fqty-u{font-size:10px;color:var(--tx2);max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.funit{font-family:var(--font-mono);font-size:10px;color:var(--tx2);width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmac{font-family:var(--font-mono);font-size:10px;color:var(--tx2);display:flex;gap:8px;flex-shrink:0}
.fmac .fc{color:var(--fuel)}
.fmac .fp{color:var(--blu)}
.empty-meal{font-size:13px;color:var(--tx2);padding:12px 0;font-style:italic}

.btn{
  background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radius-sm);
  color:var(--tx3);font-size:12px;font-weight:500;
  padding:7px 14px;cursor:pointer;white-space:nowrap;
  transition:background .2s, border-color .2s, transform .15s, box-shadow .2s;
}
.btn:hover{background:var(--bd);border-color:var(--bd-lit)}
.btn:active{transform:scale(0.98)}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-xs{
  padding:4px 8px;font-size:16px;border:none;background:transparent;
  color:var(--tx2);border-radius:4px;
}
.btn-xs:hover{color:var(--tx3);background:var(--bg3)}
.btn-g{
  background:linear-gradient(180deg, #fbbf24 0%, var(--fuel) 100%);
  border-color:var(--fuel);color:#0a0a0a;font-weight:600;
  box-shadow:0 4px 16px var(--fuel-glow);
}
.btn-g:hover{background:linear-gradient(180deg, #fcd34d 0%, #fbbf24 100%);border-color:#fbbf24}
.btn-r{color:var(--red);border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.08)}
.btn-r:hover{background:rgba(248,113,113,0.15);border-color:var(--red)}
.btn-o{background:transparent;border-color:var(--bd)}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}

.ov{
  display:none;position:fixed;inset:0;
  background:rgba(4,5,7,0.75);backdrop-filter:blur(6px);
  z-index:200;align-items:flex-start;justify-content:center;
  padding:48px 16px 20px;
  animation:fadeOverlay .25s ease;
}
.ov.on{display:flex}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);
  width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
  box-shadow:var(--shadow);
  animation:modalIn .35s var(--ease-out);
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(-16px) scale(0.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.mhd{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;font-family:var(--font-display);font-size:15px;font-weight:700;
  color:var(--tx3);letter-spacing:-0.02em;
  position:sticky;top:0;background:var(--bg2);z-index:1;
  border-bottom:1px solid var(--bd);
}
.mbd{padding:16px 20px 20px}

.sbar{display:flex;gap:8px;margin-bottom:14px}
.sinp{
  flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radius-sm);
  color:var(--tx3);font-size:14px;padding:10px 14px;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.sinp:focus{border-color:var(--fuel);box-shadow:0 0 0 3px var(--fuel-dim)}
.sinp::placeholder{color:var(--tx2)}

.frow{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:80px}
.fg label{font-size:10px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:0.06em}
.fi,.fsel{
  background:var(--bg3);border:1px solid var(--bd);border-radius:var(--radius-sm);
  color:var(--tx3);font-size:14px;padding:9px 12px;outline:none;width:100%;
  transition:border-color .2s, box-shadow .2s;
}
.fi:focus,.fsel:focus{border-color:var(--fuel);box-shadow:0 0 0 3px var(--fuel-dim)}

.ftbl{width:100%;border-collapse:collapse}
.ftbl th{
  text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--tx2);padding:10px 8px;
  border-bottom:1px solid var(--bd);
}
.ftbl td{padding:12px 8px;font-size:13px;vertical-align:middle;border-bottom:1px solid rgba(43,50,64,0.4)}
.ftbl tbody tr{transition:background .15s}
.ftbl tbody tr:hover td{background:var(--bg3)}
.ftbl .na{color:var(--tx3);font-weight:600}

.tag{
  display:inline-block;padding:2px 8px;font-size:10px;font-weight:600;
  border-radius:999px;margin-left:6px;text-transform:uppercase;letter-spacing:0.04em;
}
.tg-protein{background:rgba(56,189,248,0.15);color:var(--blu);border:1px solid rgba(56,189,248,0.25)}
.tg-carb{background:rgba(251,146,60,0.15);color:var(--org);border:1px solid rgba(251,146,60,0.25)}
.tg-fat{background:rgba(192,132,252,0.15);color:var(--pur);border:1px solid rgba(192,132,252,0.25)}
.tg-fruit{background:rgba(74,222,128,0.12);color:var(--grn);border:1px solid rgba(74,222,128,0.25)}
.tg-dairy{background:rgba(245,158,11,0.12);color:var(--fuel);border:1px solid rgba(245,158,11,0.25)}

.star{cursor:pointer;color:var(--tx2);font-size:16px;line-height:1;transition:color .2s, transform .15s}
.star:hover{transform:scale(1.15)}
.star.on{color:var(--fuel);text-shadow:0 0 12px var(--fuel-glow)}

#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--bg2);color:var(--tx3);
  font-family:var(--font-mono);font-size:12px;font-weight:500;
  padding:10px 18px;border-radius:999px;z-index:999;opacity:0;
  border:1px solid var(--bd);
  box-shadow:var(--shadow);
  transition:opacity .25s var(--ease-out), transform .25s var(--ease-out);
  pointer-events:none;max-width:90vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.tcard{
  padding:14px 0;margin-bottom:2px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--bd);
}
.tcard:last-child{border-bottom:none}
.tname{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--tx3);letter-spacing:-0.02em}
.tsub{font-family:var(--font-mono);font-size:11px;color:var(--tx2);margin-top:4px}

.favrow{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px}
.fchip{
  background:var(--bg3);padding:6px 14px;border-radius:999px;
  font-size:12px;font-weight:500;color:var(--tx3);cursor:pointer;
  border:1px solid var(--bd);transition:all .2s;
}
.fchip:hover{border-color:var(--fuel);background:var(--fuel-dim);color:var(--fuel)}
.pick-fav-label{
  font-size:10px;font-weight:600;color:var(--tx2);
  text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;
}

.stitle{
  font-family:var(--font-display);font-size:14px;font-weight:700;
  color:var(--tx3);margin-bottom:12px;letter-spacing:-0.02em;
}
.sset{margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--bd)}
.sset:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.es{text-align:center;padding:32px 16px;color:var(--tx2);font-size:13px;line-height:1.6}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.actions-bar2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

@media(max-width:580px){
  .fmac{display:none}
  .msum{flex-wrap:wrap}
  #hdr-right .hv-hide{display:none}
  #hdr{padding:12px 16px}
  #nav{padding:8px 12px 12px}
  .mval{width:120px;font-size:9px}
  .mlbl{width:56px;font-size:10px}
}

#barcode-reader{border-radius:var(--radius-sm);background:var(--bg3);min-height:220px;overflow:hidden;border:1px solid var(--bd)}
#barcode-reader video{width:100%!important;height:auto!important;display:block}
#barcode-reader__scan_region{background:var(--bg3)!important}
#barcode-reader__dashboard_section{display:none}
.scan-hint{font-size:12px;color:var(--tx2);text-align:center;margin-top:10px;line-height:1.5}
.scan-hint.loading{color:var(--fuel)}
.sync-status{font-size:12px;color:var(--tx2);margin-top:10px;line-height:1.5}
.sync-status.ok{color:var(--grn)}
.sync-status.err{color:var(--red)}
.scan-hint.err{color:var(--red)}
.scan-hint.ok{color:var(--grn)}

@media (prefers-reduced-motion: reduce){
  .screen.on,.mc,.modal,.ov{animation:none}
  .mfill{transition:none}
}
</style>

<script>
/* ══════════════════════════════════════════

══════════════════════════════════════════ */
const FOODS_VERSION = 3; // bump when default foods change

const DEFAULT_FOODS = [

const DEFAULT_TARGETS = {calories:2700, protein:190, carbs:275, fat:80};

const RECOMP_DAY_PLAN = [
  {
    name: 'Breakfast',
    foods: [
      ['f01', 5],
      ['f03', 1],
      ['f02', 2],

    ],
  },
  {

    foods: [
      ['f15', 1],
      ['f07', 1],
      ['f10', 1],
      ['f09', 1],
    ],
  },
  {
    name: 'Post-workout Shake',
    foods: [
      ['f13', 1],
      ['f10', 1],
    ],
  },
  {
    name: 'Dinner',
    foods: [
      ['f16', 1],
      ['f05', 1],
      ['f10', 1],
      ['f09', 1],
    ],
  },
];

const LEVELS = [
  {level:1,name:'Initiate', xpNeeded:0,    xpNext:500},
  {level:2,name:'Builder',  xpNeeded:500,  xpNext:1500},
  {level:3,name:'Operator', xpNeeded:1500, xpNext:3000},
  {level:4,name:'Machine',  xpNeeded:3000, xpNext:5500},
  {level:5,name:'Unit',     xpNeeded:5500, xpNext:Infinity},
];

const QUEST_DEFS = [
  {id:'hitProtein',      label:'Hit protein target',              xp:50},
  {id:'log3Meals',       label:'Log 3 meals',                     xp:30},
  {id:'eat2Fruits',      label:'Eat 2 fruit servings',            xp:20},
  {id:'withinCalories',  label:'Stay within calorie range',       xp:40},
  {id:'logWorkoutCarbs', label:'Log 50g+ carbs from carb foods',  xp:30},
];

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let S = {
  foods: [],
  logs: {},
  templates: [],
  targets: {...DEFAULT_TARGETS},
  viewDate: todayStr(),
};

let _pickContext = null;  // {mealId, date}
let _editFoodId  = null;
let _tplMealId   = null;
let _loadTplMealId = null;

/* ══════════════════════════════════════════
   PERSISTENCE
══════════════════════════════════════════ */
let sb = null;
let cloudUser = null;
let _saveTimer = null;
let _syncStatus = 'local'; // local | syncing | synced | error

function hasCloud() {
  const c = window.FUEL_OS_CONFIG;
  return !!(c?.supabaseUrl && c?.supabaseAnonKey && window.supabase);
}

function serializeState() {
  return {
    foods: S.foods,
    logs: S.logs,
    templates: S.templates,
    targets: S.targets,
    viewDate: S.viewDate,
    foodsVersion: S.foodsVersion,
  };
}

function cloudStateHasData(data) {
  if (!data || typeof data !== 'object') return false;
  if (data.logs && Object.keys(data.logs).length > 0) return true;
  if (Array.isArray(data.foods) && data.foods.length > 0) return true;
  if (Array.isArray(data.templates) && data.templates.length > 0) return true;
  return false;
}

function applyParsedState(p) {
  S = {...S, ...p};
  const storedFoodsVersion = S.foodsVersion || 1;
  S.foods = mergeDefaultFoods(S.foods);
  S.foodsVersion = FOODS_VERSION;
  if (storedFoodsVersion < FOODS_VERSION) {
    saveLocalOnly();
  }
  normalizeFoodCheckState();
  ensureRecompTemplates();
  ensureTodayPlanVisible();
}

function saveLocalOnly() {
  localStorage.setItem('fuelos_v2', JSON.stringify(S));
}

function save() {
  saveLocalOnly();
  scheduleCloudSave();
}

function loadLocal() {
  const raw = localStorage.getItem('fuelos_v2');
  if (raw) {
    try {
      applyParsedState(JSON.parse(raw));
    } catch(e) {
      S.foods = mergeDefaultFoods([]);
      S.foodsVersion = FOODS_VERSION;
      normalizeFoodCheckState();
      ensureRecompTemplates();
      ensureTodayPlanVisible();
    }
  } else {
    S.foods = mergeDefaultFoods([]);
    S.foodsVersion = FOODS_VERSION;
    normalizeFoodCheckState();
    ensureRecompTemplates();
    ensureTodayPlanVisible();
  }
  saveLocalOnly();
}

function scheduleCloudSave() {
  if (!cloudUser || !sb) return;
  clearTimeout(_saveTimer);
  _syncStatus = 'syncing';
  _saveTimer = setTimeout(pushToCloud, 700);
}

async function pushToCloud() {
  if (!cloudUser || !sb) return;
  const { error } = await sb.from('user_states').upsert({
    user_id: cloudUser.id,
    data: serializeState(),
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });
  if (error) {
    _syncStatus = 'error';
    console.error(error);
    toast('Cloud sync failed', 'var(--red)');
  } else {
    _syncStatus = 'synced';
  }
  if (document.getElementById('s-settings').classList.contains('on')) renderSettings();
}

async function pullFromCloud() {
  if (!cloudUser || !sb) return false;
  const { data, error } = await sb
    .from('user_states')
    .select('data')
    .eq('user_id', cloudUser.id)
    .maybeSingle();
  if (error) {
    console.error(error);
    toast('Could not load cloud data', 'var(--red)');
    return false;
  }
  if (cloudStateHasData(data?.data)) {
    applyParsedState(data.data);
    saveLocalOnly();
    return true;
  }
  return false;
}

async function initCloud() {
  if (!hasCloud()) return;
  const cfg = window.FUEL_OS_CONFIG;
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    cloudUser = session.user;
    const hadCloud = await pullFromCloud();
    _syncStatus = 'synced';
    maybeOfferLocalUpload(hadCloud);
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      const wasOut = !cloudUser;
      cloudUser = session.user;
      if (wasOut) {
        const hadCloud = await pullFromCloud();
        _syncStatus = 'synced';
        maybeOfferLocalUpload(hadCloud);
        renderAll();
      }
    } else {
      cloudUser = null;
      _syncStatus = 'local';
    }
    renderSettings();
  });
}

function maybeOfferLocalUpload(hadCloud) {
  if (hadCloud || !localStorage.getItem('fuelos_v2')) return;
  confirm2(
    'Your account has no saved data yet. Upload what is in this browser?',
    'Upload',
    async () => {
      await pushToCloud();
      toast('Uploaded to cloud ✓');
    }
  );
}

async function sendMagicLink() {
  if (!sb) { toast('Cloud not configured', 'var(--red)'); return; }
  const email = document.getElementById('auth-email')?.value.trim();
  if (!email) { toast('Enter your email', 'var(--red)'); return; }
  const redirectTo = window.location.origin + window.location.pathname;
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: redirectTo },
  });
  if (error) {
    toast(error.message, 'var(--red)');
    return;
  }
  toast('Check your email for the sign-in link ✓');
}

async function signOutCloud() {
  if (!sb) return;
  await sb.auth.signOut();
  cloudUser = null;
  _syncStatus = 'local';
  toast('Signed out');
  renderSettings();
}

function syncStatusHtml() {
  if (!hasCloud()) return '<p class="sync-status">Cloud sync is not configured.</p>';
  if (!cloudUser) return '<p class="sync-status">Sign in to sync across devices.</p>';
  const labels = {
    local: 'Signed in',
    syncing: 'Saving…',
    synced: 'All changes saved to cloud',
    error: 'Last save failed — still saved on this device',
  };
  const cls = _syncStatus === 'synced' ? 'sync-status ok' : _syncStatus === 'error' ? 'sync-status err' : 'sync-status';
  return `<p class="${cls}">${labels[_syncStatus] || labels.local}</p>`;
}

function renderCloudSettings() {
  if (!hasCloud()) {
    return `<div class="sset">
      <div class="stitle">Cloud sync</div>
      <p class="sync-status">Missing Supabase config.</p>
    </div>`;
  }
  if (cloudUser) {
    return `<div class="sset">
      <div class="stitle">Account</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Signed in as <strong style="color:var(--tx3)">${esc(cloudUser.email)}</strong></p>
      ${syncStatusHtml()}
      <div class="actions-bar" style="margin-top:12px;margin-bottom:0">
        <button class="btn" onclick="pushToCloud(); toast('Synced ✓')">Sync now</button>
        <button class="btn" onclick="signOutCloud()">Sign out</button>
      </div>
    </div>`;
  }
  return `<div class="sset">
    <div class="stitle">Account</div>
    <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Sign in with a magic link to save foods and logs to the cloud.</p>
    <div class="fg" style="margin-bottom:10px">
      <label>Email</label>
      <input id="auth-email" class="fi" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <button class="btn btn-g" onclick="sendMagicLink()">Email sign-in link</button>
    ${syncStatusHtml()}
  </div>`;
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayStr() { return new Date().toISOString().slice(0,10); }

function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function isToday(ds) { return ds === todayStr(); }

function prevDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function nextDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0,10);
}

function getOrCreateLog(date) {
  if (!S.logs[date]) {
    S.logs[date] = {
      meals: [
        {id:uid(), name:'Meal 1', eaten:true, foods:[]},
        {id:uid(), name:'Meal 2', eaten:true, foods:[]},
        {id:uid(), name:'Meal 3', eaten:true, foods:[]},
      ]
    };
    save();
  }
  return S.logs[date];
}

function makeFoodEntry(food, servings, eaten) {
  return {
    id: uid(),
    foodId: food.id,
    name: food.name,
    servingSize: food.servingSize,
    unit: food.unit,
    calories: food.calories,
    carbs: food.carbs,
    fat: food.fat,
    protein: food.protein,
    category: food.category,
    servings: servings || 1,
    eaten: eaten !== false,
  };
}

function mergeDefaultFoods(existingFoods) {
  const existing = Array.isArray(existingFoods) ? existingFoods : [];
  const byId = new Map(existing.map(f => [f.id, f]));
  const merged = existing.map(f => ({...f}));
  for(const df of DEFAULT_FOODS) {
    if(!byId.has(df.id)) {
      merged.push({...df});
    }
  }
  return merged;
}

function makePlanMeal(planMeal) {
  return {
    id: uid(),
    name: planMeal.name,
    eaten: false,
    foods: planMeal.foods.map(([foodId, servings]) => {
      const food = S.foods.find(f => f.id === foodId);
      return food ? makeFoodEntry(food, servings, false) : null;
    }).filter(Boolean),
  };
}

function makePlanTemplate(planMeal) {
  const meal = makePlanMeal(planMeal);
  return {
    id: `tpl-${planMeal.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}`,
    name: meal.name,
    foods: meal.foods.map(e => ({...e, id:uid()})),
  };
}

function logIsEmpty(log) {
  return !log || !Array.isArray(log.meals) || log.meals.every(m => !m.foods || m.foods.length === 0);
}

function ensureRecompTemplates() {
  if(!Array.isArray(S.templates)) S.templates = [];
  const existingNames = new Set(S.templates.map(t => t.name));
  for(const planMeal of RECOMP_DAY_PLAN) {
    if(!existingNames.has(planMeal.name)) {
      S.templates.push(makePlanTemplate(planMeal));
    }
  }
}

function ensureTodayPlanVisible() {
  const date = todayStr();
  const log = S.logs[date];
  if(!logIsEmpty(log)) return;
  S.logs[date] = {
    meals: RECOMP_DAY_PLAN.map(makePlanMeal),
  };
}

function normalizeFoodCheckState() {
  for(const log of Object.values(S.logs || {})) {
    if(!log || !Array.isArray(log.meals)) continue;
    for(const meal of log.meals) {
      if(!Array.isArray(meal.foods)) meal.foods = [];
      for(const entry of meal.foods) {
        if(typeof entry.eaten === 'undefined') {
          entry.eaten = meal.eaten !== false;
        }
      }
      syncMealEaten(meal);
    }
  }
}

function mealMacros(meal) {
  let c=0,p=0,cr=0,f=0;
  for(const e of meal.foods){
    c  += e.calories * e.servings;
    p  += e.protein  * e.servings;
    cr += e.carbs    * e.servings;
    f  += e.fat      * e.servings;
  }
  return {cal:Math.round(c),protein:Math.round(p),carbs:Math.round(cr),fat:Math.round(f)};
}

function sumMealsMacros(meals, includeMeal, includeEntry) {
  let c=0,p=0,cr=0,f=0;
  for(const m of meals){
    if(includeMeal && !includeMeal(m)) continue;
    for(const e of m.foods){
      if(includeEntry && !includeEntry(e, m)) continue;
      c  += e.calories * e.servings;
      p  += e.protein  * e.servings;
      cr += e.carbs    * e.servings;
      f  += e.fat      * e.servings;
    }
  }
  return {cal:Math.round(c),protein:Math.round(p),carbs:Math.round(cr),fat:Math.round(f)};
}

function dayMacros(date) {
  const log = S.logs[date];
  if(!log) return {cal:0,protein:0,carbs:0,fat:0};
  return sumMealsMacros(log.meals, null, entry => entry.eaten !== false);
}

function projectedDayMacros(date) {
  const log = S.logs[date];
  if(!log) return {cal:0,protein:0,carbs:0,fat:0};
  return sumMealsMacros(log.meals, meal => meal.foods.length > 0);
}

function evaluateQuests(date) {
  const log = S.logs[date];
  if(!log) return [];
  const m = dayMacros(date);
  const done = [];

  if(m.protein >= S.targets.protein) done.push('hitProtein');

  const mealsWithFood = log.meals.filter(ml => ml.foods.some(e => e.eaten !== false)).length;
  if(mealsWithFood >= 3) done.push('log3Meals');

  let fruitServings = 0;
  let carbFoodCarbs = 0;
  for(const meal of log.meals){
    for(const e of meal.foods){
      if(e.eaten === false) continue;
      if(e.category === 'fruit') fruitServings += e.servings;
      if(e.category === 'carb')  carbFoodCarbs += e.carbs * e.servings;
    }
  }
  if(fruitServings >= 2) done.push('eat2Fruits');
  if(m.cal >= S.targets.calories * 0.8 && m.cal <= S.targets.calories + 150) done.push('withinCalories');
  if(carbFoodCarbs >= 50) done.push('logWorkoutCarbs');

  return done;
}

function dayXP(date) {
  const done = evaluateQuests(date);
  return done.reduce((t,qid) => {
    const q = QUEST_DEFS.find(q => q.id === qid);
    return t + (q ? q.xp : 0);
  }, 0);
}

function totalXP() {
  return Object.keys(S.logs).reduce((t,d) => t + dayXP(d), 0);
}

function computeStreak() {
  let streak = 0;
  let d = todayStr();
  while(true) {
    const log = S.logs[d];
    const hasFood = log && log.meals.some(m => m.foods.some(e => e.eaten !== false));
    if(!hasFood) break;
    streak++;
    d = prevDate(d);
    if(streak > 3650) break;
  }
  return streak;
}

function getLevel(xp) {
  let lvl = LEVELS[0];
  for(const l of LEVELS) if(xp >= l.xpNeeded) lvl = l;
  return lvl;
}

function pct(val, max) {
  if(max === 0) return 0;
  return Math.min(100, Math.round(val / max * 100));
}

function barClass(val, max, type) {
  const p = val / max;
  if(p > 1.05) return type + ' over';
  return type;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmtNum(n) {
  const v = Math.round(n * 10) / 10;
  return Number.isInteger(v) ? String(v) : String(v);
}

function fmtAmount(size, unit) {
  return `${fmtNum(size)} ${unit}`.trim();
}

function fmtConsumedAmount(entry) {
  return fmtAmount(entry.servingSize * entry.servings, entry.unit);
}

function normalizeUnit(unit) {
  return String(unit || '').trim().toLowerCase();
}

function hasAmountUnit(unit) {
  return normalizeUnit(unit).length > 0;
}

function unitLabel(unit) {
  const u = normalizeUnit(unit);
  if(u === 'g' || u === 'gram' || u === 'grams') return 'g';
  if(u === 'ml' || u === 'milliliter' || u === 'milliliters') return 'ml';
  if(u === 'tbsp' || u === 'tablespoon' || u === 'tablespoons') return 'tbsp';
  if(u === 'tsp' || u === 'teaspoon' || u === 'teaspoons') return 'tsp';
  if(u === 'oz' || u === 'ounce' || u === 'ounces') return 'oz';
  return String(unit || '').trim();
}

function fmtInputAmount(entry) {
  if(hasAmountUnit(entry.unit) && entry.servingSize > 0) {
    return fmtNum(entry.servingSize * entry.servings);
  }
  return fmtNum(entry.servings);
}

function fmtInputHint(entry) {
  if(hasAmountUnit(entry.unit) && entry.servingSize > 0) {
    return `Enter ${unitLabel(entry.unit)}. Per serving: ${fmtAmount(entry.servingSize, entry.unit)}`;
  }
  return 'Servings';
}

function fmtAmountSideLabel(entry) {
  return `×${fmtNum(entry.servings)} srv`;
}

function checkedFoodsCount(log) {
  return log.meals.reduce((total, meal) => total + meal.foods.filter(e => e.eaten !== false).length, 0);
}

function plannedFoodsCount(log) {
  return log.meals.reduce((total, meal) => total + meal.foods.length, 0);
}

function mealCheckedState(meal) {
  if(meal.foods.length === 0) return 'empty';
  const checked = meal.foods.filter(e => e.eaten !== false).length;
  if(checked === 0) return 'none';
  if(checked === meal.foods.length) return 'all';
  return 'partial';
}

function syncMealEaten(meal) {
  meal.eaten = meal.foods.some(e => e.eaten !== false);
}

function tagHtml(cat) {
  const map = {protein:'tg-protein',carb:'tg-carb',fat:'tg-fat',fruit:'tg-fruit',dairy:'tg-dairy'};
  const cls = map[cat] || '';
  return `<span class="tag ${cls}">${esc(cat)}</span>`;
}

function macroBudgetRow(label, actual, projected, target, type, unit) {
  const actualPct = pct(actual, target);
  const projectedPct = pct(projected, target);
  const projectedOver = macroOver(projected, target, type) ? 'over' : '';
  const actualOver = macroOver(actual, target, type) ? 'over' : '';
  const suffix = unit || '';
  return `
    <div class="mrow">
      <div class="mlbl">${label}</div>
      <div class="mbg">
        <div class="mfill ${type} plan ${projectedOver}" style="width:${projectedPct}%"></div>
        <div class="mfill ${type} actual ${actualOver}" style="width:${actualPct}%"></div>
      </div>
      <div class="mval">${actual}${suffix} / ${projected}${suffix} / ${target}${suffix}</div>
    </div>`;
}

function macroOver(value, target, type) {
  if(type === 'cal') return value > target + 150;
  if(type === 'pro') return value > target * 1.3;
  return value > target * 1.1;
}

function toast(msg, col) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  const accent = col || 'var(--grn)';
  el.style.borderColor = accent;
  el.style.color = 'var(--tx3)';
  el.style.boxShadow = `0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px ${accent}`;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2400);
}

            <button class="btn btn-sm" onclick="openSaveTemplate('${meal.id}','${date}')">Save</button>

      id: uid(),

      eaten: m.eaten !== false,

    renderToday();
    renderHeader();

  renderHeader();

function updateServing(date, mealId, entryId, val) {
  const v = parseFloat(val);
  if(isNaN(v) || v <= 0) return;
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  const entry = meal.foods.find(e => e.id === entryId);
  if(!entry) return;
  if(hasAmountUnit(entry.unit) && entry.servingSize > 0) {
    entry.servings = v / entry.servingSize;
  } else {
    entry.servings = v;
  }
  save();
}

  const log = S.logs[date];

  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  meal.foods = meal.foods.filter(e => e.id !== entryId);
  syncMealEaten(meal);
  save();
  renderToday();
  renderHeader();
}

/* ══════════════════════════════════════════
   ACTIONS: FOOD DATABASE — barcode scan + CRUD
══════════════════════════════════════════ */
let _barcodeScanner = null;
let _barcodeScanBusy = false;

function setScanStatus(msg, kind) {
  const el = document.getElementById('scan-status');
  if(!el) return;
  el.textContent = msg;
  el.className = 'scan-hint' + (kind ? ' ' + kind : '');
}

function parseServingSize(raw) {
  if(!raw) return {servingSize:100, unit:'g', grams:100};
  const s = String(raw).trim();
  const gramMatch = s.match(/(\d+\.?\d*)\s*g\b/i);
  if(gramMatch) {
    const g = parseFloat(gramMatch[1]);
    return {servingSize:g, unit:'g', grams:g};
  }
  const mlMatch = s.match(/(\d+\.?\d*)\s*ml\b/i);
  if(mlMatch) {
    const ml = parseFloat(mlMatch[1]);
    return {servingSize:ml, unit:'ml', grams:ml};
  }
  const numMatch = s.match(/^(\d+\.?\d*)/);
  if(numMatch) {
    const n = parseFloat(numMatch[1]);
    const unit = s.replace(/^\d+\.?\d*\s*/, '').replace(/\(.*\)/, '').trim() || 'serving';
    return {servingSize:n, unit, grams:null};
  }
  return {servingSize:1, unit:'serving', grams:null};
}

function guessFoodCategory(protein, carbs, fat) {
  const macroTotal = protein + carbs + fat;
  if(macroTotal <= 0) return 'other';
  if(protein / macroTotal >= 0.4 && protein >= 8) return 'protein';
  if(fat / macroTotal >= 0.45) return 'fat';
  if(carbs / macroTotal >= 0.45) return 'carb';
  return 'other';
}

function extractNutrients(n, servingGrams) {
  const round1 = v => Math.round(v * 10) / 10;
  if(n['energy-kcal_serving'] != null || n.proteins_serving != null) {
    return {
      calories: Math.round(n['energy-kcal_serving'] || 0),
      protein:  round1(n.proteins_serving || 0),
      carbs:    round1(n.carbohydrates_serving || 0),
      fat:      round1(n.fat_serving || 0),
    };
  }
  const grams = servingGrams || 100;
  const factor = grams / 100;
  return {
    calories: Math.round((n['energy-kcal_100g'] || 0) * factor),
    protein:  round1((n.proteins_100g || 0) * factor),
    carbs:    round1((n.carbohydrates_100g || 0) * factor),
    fat:      round1((n.fat_100g || 0) * factor),
  };
}

function mapOpenFoodFactsProduct(product) {
  const serving = parseServingSize(product.serving_size);
  const grams = serving.grams || (product.serving_quantity ? parseFloat(product.serving_quantity) : null);
  const macros = extractNutrients(product.nutriments || {}, grams);
  if(!macros.calories && !macros.protein && !macros.carbs && !macros.fat) {
    throw new Error('No nutrition data on this product — enter manually.');
  }
  return {
    name: (product.product_name || product.generic_name || 'Unknown product').trim(),
    category: guessFoodCategory(macros.protein, macros.carbs, macros.fat),
    servingSize: serving.servingSize,
    unit: serving.unit,
    ...macros,
  };
}

async function lookupOpenFoodFacts(barcode) {
  const code = String(barcode).replace(/\D/g, '');
  if(code.length < 8) throw new Error('Invalid barcode.');
  const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,generic_name,serving_size,serving_quantity,nutriments`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Lookup failed — check your connection.');
  const data = await res.json();
  if(data.status !== 1 || !data.product) throw new Error('Product not found in Open Food Facts.');
  return mapOpenFoodFactsProduct(data.product);
}

async function stopBarcodeScanner() {
  if(!_barcodeScanner) return;
  const scanner = _barcodeScanner;
  _barcodeScanner = null;
  try {
    if(scanner.isScanning && scanner.isScanning()) await scanner.stop();
    scanner.clear();
  } catch { /* camera may already be released */ }
}

async function startBarcodeScanner() {
  if(typeof Html5Qrcode === 'undefined') {
    setScanStatus('Scanner library failed to load.', 'err');
    return;
  }
  await stopBarcodeScanner();
  _barcodeScanner = new Html5Qrcode('barcode-reader');
  const config = {
    fps: 10,
    qrbox: (w, h) => ({width: Math.min(w * 0.92, 320), height: Math.min(h * 0.45, 140)}),
    aspectRatio: 1.333,
  };
  try {
    await _barcodeScanner.start(
      {facingMode: 'environment'},
      config,
      decoded => handleBarcodeDetected(decoded),
      () => {}
    );
  } catch {
    setScanStatus('Camera access denied or unavailable. Enter barcode manually below.', 'err');
  }
}

async function handleBarcodeDetected(code) {
  if(_barcodeScanBusy) return;
  _barcodeScanBusy = true;
  const barcode = String(code).replace(/\D/g, '');
  if(barcode.length < 8) { _barcodeScanBusy = false; return; }
  setScanStatus('Looking up ' + barcode + '…', 'loading');
  await stopBarcodeScanner();
  try {
    const food = await lookupOpenFoodFacts(barcode);
    fillFoodFormFromScan(food);
    closeModal('ov-barcode-scanner');
    toast('Product found — review & save ✓');
  } catch (err) {
    setScanStatus(err.message || 'Product not found.', 'err');
    _barcodeScanBusy = false;
    startBarcodeScanner();
  }
}

function lookupManualBarcode() {
  const code = document.getElementById('barcode-manual').value.replace(/\D/g, '');
  if(code.length < 8) { toast('Enter a valid barcode (8+ digits)', 'var(--red)'); return; }
  handleBarcodeDetected(code);
}

function openSaveTemplate(mealId, date) {

function submitSaveTemplate() {
  const name = document.getElementById('tpl-name').value.trim();
  if(!name) { toast('Name required', 'var(--red)'); return; }

  if(!log) return;

  if(!meal) return;
  S.templates.push({
    id: uid(),
    name,
    foods: meal.foods.map(e => ({...e, id:uid()})),

function openLoadTpl(mealId, date) {

  _loadTplDate    = date;

let _loadTplDate = null;

function applyTemplate(tplId) {
  const tpl = S.templates.find(t => t.id === tplId);
  if(!tpl) return;
  const log  = getOrCreateLog(_loadTplDate);
  const meal = log.meals.find(m => m.id === _loadTplMealId);
  if(!meal) return;
  meal.foods = [...meal.foods, ...tpl.foods.map(e => ({...e, id:uid(), eaten: meal.eaten !== false}))];
  syncMealEaten(meal);
  save();
  closeModal('ov-load-tpl');
  renderToday();
  renderHeader();
  toast(`Loaded "${tpl.name}" ✓`);
}

function loadTemplateIntoMeal(tplId) {
  const date = S.viewDate;
  const log  = getOrCreateLog(date);
  if(log.meals.length === 0) {
    addMeal(date);
  }
  _loadTplMealId = null;
  _loadTplDate   = date;
  const tpl = S.templates.find(t => t.id === tplId);
  if(!tpl) return;
  // load into first meal or ask
  const mealId = log.meals[0].id;
  _loadTplMealId = mealId;
  applyTemplate(tplId);
}

function confirmDeleteTemplate(tplId) {

/* ══════════════════════════════════════════
   IMPORT / EXPORT
══════════════════════════════════════════ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `fuelos-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exported ✓');
}

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.foods && data.logs) {
          S = {...S, ...data};
          S.foods = mergeDefaultFoods(S.foods);
          normalizeFoodCheckState();
          save();
          renderAll();
          toast('Backup imported ✓');
        } else {
          toast('Invalid backup file', 'var(--red)');
        }
      } catch { toast('Failed to parse file', 'var(--red)'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}

function exportCSV() {
  const rows = [['Date','Meal','Meal Eaten','Food','Food Eaten','Servings','Unit','Calories','Protein','Carbs','Fat']];
  for(const [date, log] of Object.entries(S.logs)) {
    for(const meal of log.meals) {
      for(const e of meal.foods) {
        rows.push([
          date, meal.name, mealCheckedState(meal) === 'all' ? 'yes' : mealCheckedState(meal) === 'partial' ? 'partial' : 'no',
          e.name, e.eaten !== false ? 'yes' : 'no', e.servings, e.unit,
          Math.round(e.calories*e.servings),
          Math.round(e.protein*e.servings),
          Math.round(e.carbs*e.servings),
          Math.round(e.fat*e.servings),
        ]);
      }
    }
  }
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `fuelos-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported ✓');
}

/* ══════════════════════════════════════════
   MODAL HELPERS
══════════════════════════════════════════ */
function openModal(id) {
  document.getElementById(id).classList.add('on');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('on');
}

function confirm2(msg, label, cb) {
  document.getElementById('conf-title').textContent = 'Confirm';
  document.getElementById('conf-msg').textContent = msg;
  const btn = document.getElementById('conf-ok');
  btn.textContent = label || 'Confirm';
  btn.onclick = () => { closeModal('ov-confirm'); cb(); };
  openModal('ov-confirm');
}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
function renderAll() {
  renderHeader();
  const activeScreen = document.querySelector('.screen.on');
  const sid = activeScreen ? activeScreen.id : 's-today';
  if(sid === 's-today')     renderToday();
  if(sid === 's-foods')     renderFoods();
  if(sid === 's-templates') renderTemplates();
  if(sid === 's-settings')  renderSettings();
}

document.querySelectorAll('.nb').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    btn.classList.add('on');
    const sid = 's-' + btn.dataset.s;
    document.getElementById(sid).classList.add('on');
    if(btn.dataset.s === 'today')     renderToday();
    if(btn.dataset.s === 'foods')     renderFoods();
    if(btn.dataset.s === 'templates') renderTemplates();
    if(btn.dataset.s === 'settings')  renderSettings();
  });
});

// Close modals on overlay click
document.querySelectorAll('.ov').forEach(ov => {
  ov.addEventListener('click', e => {
    if(e.target === ov) ov.classList.remove('on');
  });
});

// Close modals on Escape
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    document.querySelectorAll('.ov.on').forEach(ov => ov.classList.remove('on'));
  }
});

   INIT
══════════════════════════════════════════ */
async function boot() {
  loadLocal();
  renderHeader();
  renderToday();
  await initCloud();
  if (cloudUser) renderAll();
}
boot();
