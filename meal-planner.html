<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel OS — Meal Planner</title>
<style>
:root {
  --bg:   #fafafa;
  --bg2:  #fff;
  --bg3:  #f4f4f4;
  --bd:   #e5e5e5;
  --tx:   #444;
  --tx2:  #999;
  --tx3:  #111;
  --grn:  #2d7a4f;
  --blu:  #2563eb;
  --org:  #b45309;
  --pur:  #7c3aed;
  --red:  #dc2626;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer}

#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--bg2);
  position:sticky;top:0;z-index:50;
}
.logo{color:var(--tx3);font-size:15px;font-weight:600}
.logo .cur{display:none}
#hdr-right{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--tx2)}
#hdr-right .hv{color:var(--tx3)}
#hdr-right .hvg{color:var(--tx3);font-weight:500}
#hdr-right .hvo{color:var(--tx3)}

#nav{
  display:flex;gap:4px;padding:0 16px 12px;background:var(--bg2);
  overflow-x:auto;scrollbar-width:none;
}
#nav::-webkit-scrollbar{display:none}
.nb{
  background:none;border:none;border-radius:6px;
  color:var(--tx2);font-size:13px;padding:6px 12px;cursor:pointer;white-space:nowrap;
}
.nb:hover{color:var(--tx3);background:var(--bg3)}
.nb.on{color:var(--tx3);background:var(--bg3);font-weight:500}

#main{max-width:720px;margin:0 auto;padding:8px 20px 48px}
.screen{display:none}.screen.on{display:block}

.panel{background:var(--bg2);margin-bottom:20px}
.ph{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 0 8px;font-size:12px;color:var(--tx2);
}
.ph .pt{color:var(--tx3);font-size:13px;font-weight:500}
.pb{padding:0}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.scard{background:var(--bg3);padding:12px;border-radius:6px}
.sl{font-size:11px;color:var(--tx2)}
.sv{font-size:22px;color:var(--tx3);line-height:1.2;margin-top:2px;font-weight:500}
.ss{font-size:12px;color:var(--tx2);margin-top:2px}

.mrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mlbl{width:64px;font-size:12px;color:var(--tx2)}
.mbg{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;position:relative}
.mfill{height:100%;transition:width .3s ease;max-width:100%;border-radius:3px}
.mfill.plan{opacity:.35}
.mfill.actual{position:absolute;left:0;top:0;height:100%}
.mfill.cal{background:var(--grn)}
.mfill.pro{background:var(--blu)}
.mfill.car{background:var(--org)}
.mfill.fat{background:var(--pur)}
.mfill.over{background:var(--red)}
.mval{width:140px;font-size:11px;text-align:right;color:var(--tx2)}
.budget-legend{display:flex;justify-content:flex-end;gap:14px;margin-bottom:10px;font-size:11px;color:var(--tx2)}
.budget-legend .actual-dot,.budget-legend .plan-dot{display:inline-block;width:14px;height:4px;margin-right:4px;border-radius:2px;vertical-align:middle}
.budget-legend .actual-dot{background:var(--grn)}
.budget-legend .plan-dot{background:var(--grn);opacity:.35}

.dnav{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.ddisp{flex:1;text-align:center;font-size:15px;color:var(--tx3);font-weight:500}
.dsub{font-size:12px;color:var(--tx2);font-weight:400;margin-left:6px}

.mc{margin-bottom:24px}
.mc.pending{opacity:.55}
.mc.eaten .meal-check.on{background:var(--grn);border-color:var(--grn)}
.mc.partial{opacity:.85}
.mch{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:0 0 8px;
}
.mhead-left{display:flex;align-items:center;gap:8px;min-width:140px}
.meal-check{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border:1px solid var(--bd);border-radius:4px;color:var(--tx2);
  font-size:11px;line-height:1;flex-shrink:0;
}
.meal-check:hover{border-color:var(--tx2)}
.meal-check.on{background:var(--grn);border-color:var(--grn);color:#fff}
.mname{
  background:transparent;border:none;
  color:var(--tx3);font-size:15px;font-weight:500;
  width:140px;outline:none;padding:0;
}
.mc.pending .mname{color:var(--tx2)}
.mname:focus{outline:1px dotted var(--tx2);outline-offset:2px}
.msum{display:flex;gap:12px;font-size:12px;color:var(--tx2)}
.msum span{color:var(--tx3)}
.macts{display:flex;gap:6px}
.more-actions{position:relative}
.more-actions summary{list-style:none}
.more-actions summary::-webkit-details-marker{display:none}
.more-menu{
  display:flex;gap:4px;position:absolute;right:0;top:28px;z-index:20;
  background:var(--bg2);padding:6px;border-radius:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);white-space:nowrap;
}
.mfl{padding:0}
.fr{display:flex;align-items:center;gap:8px;padding:6px 0}
.fr.skipped{opacity:.45}
.fr.skipped .fname{color:var(--tx2)}
.food-check{
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border:1px solid var(--bd);border-radius:3px;color:transparent;
  font-size:10px;line-height:1;flex-shrink:0;
}
.food-check:hover{border-color:var(--tx2)}
.food-check.on{border-color:var(--grn);background:var(--grn);color:#fff}
.food-remove{
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--tx2);font-size:14px;line-height:1;flex-shrink:0;
}
.food-remove:hover{color:var(--red)}
.fname{flex:1;font-size:14px;color:var(--tx3)}
.fqty{display:flex;align-items:center;gap:4px;flex-shrink:0}
.fsrv{
  width:52px;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;
  color:var(--tx3);font-size:13px;padding:3px 6px;text-align:center;outline:none;
}
.fsrv.amt{width:56px}
.fsrv:focus{border-color:var(--tx2)}
.fqty-u{font-size:11px;color:var(--tx2);max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.funit{font-size:11px;color:var(--tx2);width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmac{font-size:11px;color:var(--tx2);display:flex;gap:8px;flex-shrink:0}
.fmac .fc{color:var(--tx3)}
.fmac .fp{color:var(--blu)}
.empty-meal{font-size:13px;color:var(--tx2);padding:8px 0}

.btn{
  background:var(--bg2);border:1px solid var(--bd);border-radius:6px;color:var(--tx3);
  font-size:12px;padding:5px 10px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--bg3)}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-xs{padding:2px 6px;font-size:14px;border:none;background:none;color:var(--tx2)}
.btn-xs:hover{color:var(--tx3);background:none}
.btn-g{background:var(--tx3);border-color:var(--tx3);color:#fff}
.btn-g:hover{background:#333;border-color:#333}
.btn-r{color:var(--red);border-color:transparent;background:none}
.btn-r:hover{background:#fef2f2}
.btn-o{background:none}

.ov{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);
  z-index:200;align-items:flex-start;justify-content:center;padding:48px 16px 20px;
}
.ov.on{display:flex}
.modal{
  background:var(--bg2);border-radius:8px;width:100%;max-width:480px;
  max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.mhd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;font-size:14px;font-weight:500;color:var(--tx3);
  position:sticky;top:0;background:var(--bg2);z-index:1;
}
.mbd{padding:0 16px 16px}

.sbar{display:flex;gap:8px;margin-bottom:12px}
.sinp{
  flex:1;background:var(--bg2);border:1px solid var(--bd);border-radius:6px;color:var(--tx3);
  font-size:14px;padding:8px 10px;outline:none;
}
.sinp:focus{border-color:var(--tx2)}
.sinp::placeholder{color:var(--tx2)}

.frow{display:flex;gap:10px;margin-bottom:12px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:80px}
.fg label{font-size:11px;color:var(--tx2)}
.fi,.fsel{
  background:var(--bg2);border:1px solid var(--bd);border-radius:6px;color:var(--tx3);
  font-size:14px;padding:7px 10px;outline:none;width:100%;
}
.fi:focus,.fsel:focus{border-color:var(--tx2)}

.ftbl{width:100%;border-collapse:collapse}
.ftbl th{
  text-align:left;font-size:11px;font-weight:500;
  color:var(--tx2);padding:8px 6px;
}
.ftbl td{padding:10px 6px;font-size:13px;vertical-align:middle}
.ftbl tbody tr:hover td{background:var(--bg3)}
.ftbl .na{color:var(--tx3);font-weight:500}

.tag{display:inline-block;padding:1px 6px;font-size:10px;border-radius:4px;background:var(--bg3);color:var(--tx2);margin-left:6px}
.tg-protein{background:#eff6ff;color:var(--blu)}
.tg-carb{background:#fffbeb;color:var(--org)}
.tg-fat{background:#f5f3ff;color:var(--pur)}
.tg-fruit{background:#f0fdf4;color:var(--grn)}
.tg-dairy{background:#fefce8;color:#a16207}

.star{cursor:pointer;color:var(--tx2);font-size:15px;line-height:1}
.star.on{color:var(--org)}

#toast{
  position:fixed;bottom:20px;right:20px;background:var(--tx3);color:#fff;
  font-size:13px;padding:8px 14px;border-radius:6px;z-index:999;opacity:0;
  transform:translateY(6px);transition:all .2s;pointer-events:none;
}
#toast.on{opacity:1;transform:translateY(0)}

.tcard{
  padding:12px 0;margin-bottom:4px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.tname{font-size:14px;color:var(--tx3);font-weight:500}
.tsub{font-size:12px;color:var(--tx2);margin-top:2px}

.favrow{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.fchip{
  background:var(--bg3);padding:5px 10px;border-radius:16px;
  font-size:13px;color:var(--tx3);cursor:pointer;border:none;
}
.fchip:hover{background:var(--bd)}

.stitle{font-size:13px;font-weight:500;color:var(--tx3);margin-bottom:10px}
.sset{margin-bottom:24px}

.es{text-align:center;padding:24px;color:var(--tx2);font-size:13px}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.actions-bar2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:580px){
  .fmac{display:none}
  .msum{flex-wrap:wrap}
  #hdr-right .hv-hide{display:none}
}

#barcode-reader{border-radius:6px;background:var(--bg3);min-height:220px;overflow:hidden}
#barcode-reader video{width:100%!important;height:auto!important;display:block}
#barcode-reader__scan_region{background:var(--bg3)!important}
#barcode-reader__dashboard_section{display:none}
.scan-hint{font-size:12px;color:var(--tx2);text-align:center;margin-top:8px;line-height:1.4}
.scan-hint.loading{color:var(--org)}
.scan-hint.err{color:var(--red)}
.scan-hint.ok{color:var(--grn)}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div id="toast"></div>

<!-- HEADER -->
<div id="hdr">
  <div class="logo">Fuel OS</div>
  <div id="hdr-right"></div>
</div>

<!-- NAV -->
<div id="nav">
  <button class="nb on" data-s="today">Today</button>
  <button class="nb" data-s="foods">Foods</button>
  <button class="nb" data-s="templates">Templates</button>
  <button class="nb" data-s="settings">Settings</button>
</div>

<!-- MAIN -->
<div id="main">
  <div id="s-today"  class="screen on"></div>
  <div id="s-foods"  class="screen"></div>
  <div id="s-templates" class="screen"></div>
  <div id="s-settings"  class="screen"></div>
</div>

<!-- MODAL: ADD FOOD TO MEAL -->
<div id="ov-pick" class="ov">
  <div class="modal">
    <div class="mhd">
      <span>ADD FOOD TO MEAL</span>
      <button class="btn-xs" onclick="closeModal('ov-pick')">✕</button>
    </div>
    <div class="mbd">
      <div class="sbar">
        <input id="pick-search" class="sinp" placeholder="search foods…" oninput="renderPickList()" autocomplete="off">
      </div>
      <div id="pick-favs"></div>
      <div id="pick-list"></div>
    </div>
  </div>
</div>

<!-- MODAL: ADD/EDIT FOOD IN DB -->
<div id="ov-food-form" class="ov">
  <div class="modal">
    <div class="mhd">
      <span id="ffm-title">ADD FOOD</span>
      <button class="btn-xs" onclick="closeModal('ov-food-form')">✕</button>
    </div>
    <div class="mbd">
      <div class="frow">
        <div class="fg" style="flex:2;min-width:160px">
          <label>Name</label>
          <input id="ff-name" class="fi" placeholder="Food name">
        </div>
        <div class="fg">
          <label>Category</label>
          <select id="ff-cat" class="fsel">
            <option value="protein">Protein</option>
            <option value="carb">Carb</option>
            <option value="fat">Fat</option>
            <option value="fruit">Fruit</option>
            <option value="dairy">Dairy</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label>Serving Size</label>
          <input id="ff-srv" class="fi" type="number" min="0" step="any" placeholder="e.g. 100">
        </div>
        <div class="fg">
          <label>Unit</label>
          <input id="ff-unit" class="fi" placeholder="g, oz, ml, piece…">
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label>Calories</label>
          <input id="ff-cal" class="fi" type="number" min="0" step="any" placeholder="0">
        </div>
        <div class="fg">
          <label>Protein (g)</label>
          <input id="ff-pro" class="fi" type="number" min="0" step="any" placeholder="0">
        </div>
        <div class="fg">
          <label>Carbs (g)</label>
          <input id="ff-car" class="fi" type="number" min="0" step="any" placeholder="0">
        </div>
        <div class="fg">
          <label>Fat (g)</label>
          <input id="ff-fat" class="fi" type="number" min="0" step="any" placeholder="0">
        </div>
      </div>
      <div class="actions-bar2">
        <button class="btn btn-o" onclick="openBarcodeScanner()">📷 SCAN BARCODE</button>
        <button class="btn btn-g" onclick="submitFoodForm()">SAVE FOOD</button>
        <button class="btn" onclick="closeModal('ov-food-form')">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: SAVE TEMPLATE -->
<div id="ov-tpl" class="ov">
  <div class="modal">
    <div class="mhd">
      <span>SAVE AS TEMPLATE</span>
      <button class="btn-xs" onclick="closeModal('ov-tpl')">✕</button>
    </div>
    <div class="mbd">
      <div class="fg" style="margin-bottom:10px">
        <label>Template Name</label>
        <input id="tpl-name" class="fi" placeholder="e.g. High Protein Breakfast">
      </div>
      <div class="actions-bar">
        <button class="btn btn-g" onclick="submitSaveTemplate()">SAVE</button>
        <button class="btn" onclick="closeModal('ov-tpl')">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: CONFIRM -->
<div id="ov-confirm" class="ov">
  <div class="modal" style="max-width:380px">
    <div class="mhd"><span id="conf-title">CONFIRM</span></div>
    <div class="mbd">
      <p id="conf-msg" style="margin-bottom:14px;font-size:12px"></p>
      <div class="actions-bar">
        <button class="btn btn-r" id="conf-ok">CONFIRM</button>
        <button class="btn" onclick="closeModal('ov-confirm')">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: BARCODE SCANNER -->
<div id="ov-barcode-scanner" class="ov">
  <div class="modal" style="max-width:480px">
    <div class="mhd">
      <span>SCAN BARCODE</span>
      <button class="btn-xs" onclick="closeBarcodeScanner()">✕</button>
    </div>
    <div class="mbd">
      <div id="barcode-reader"></div>
      <p id="scan-status" class="scan-hint">Point camera at the UPC barcode on the package.</p>
      <div class="frow" style="margin-top:10px;margin-bottom:0">
        <div class="fg" style="flex:2;min-width:140px">
          <label>Or enter barcode</label>
          <input id="barcode-manual" class="fi" placeholder="e.g. 012345678905" inputmode="numeric"
            onkeydown="if(event.key==='Enter')lookupManualBarcode()">
        </div>
        <button class="btn btn-g" style="align-self:flex-end" onclick="lookupManualBarcode()">LOOK UP</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: LOAD TEMPLATE INTO MEAL -->
<div id="ov-load-tpl" class="ov">
  <div class="modal">
    <div class="mhd">
      <span>LOAD TEMPLATE</span>
      <button class="btn-xs" onclick="closeModal('ov-load-tpl')">✕</button>
    </div>
    <div class="mbd" id="load-tpl-list"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════ */
const FOODS_VERSION = 3; // bump when default foods change

const DEFAULT_FOODS = [
  {id:'f01',name:'Egg',              servingSize:1,   unit:'egg',    calories:70,  carbs:0,  fat:5,  protein:6,   category:'protein',favorite:false},
  {id:'f02',name:'Sourdough Bread',  servingSize:1,   unit:'slice',  calories:100, carbs:20, fat:0,  protein:3,   category:'carb',   favorite:false},
  {id:'f03',name:'Chicken Sausage',  servingSize:3,   unit:'links',  calories:130, carbs:1,  fat:8,  protein:12,  category:'protein',favorite:false},
  {id:'f04',name:'Butter',           servingSize:1,   unit:'tbsp',   calories:100, carbs:0,  fat:11, protein:0,   category:'fat',    favorite:false},
  {id:'f05',name:'Honey',            servingSize:1,   unit:'tbsp',   calories:60,  carbs:17, fat:0,  protein:0,   category:'carb',   favorite:false},
  {id:'f06',name:'Half n Half',      servingSize:2,   unit:'tbsp',   calories:40,  carbs:1,  fat:3,  protein:1,   category:'dairy',  favorite:false},
  {id:'f07',name:'Cheese',           servingSize:28,  unit:'g',      calories:110, carbs:1,  fat:9,  protein:7,   category:'dairy',  favorite:false},
  {id:'f08',name:'Greek Yogurt',     servingSize:170, unit:'g',      calories:100, carbs:7,  fat:0,  protein:18,  category:'dairy',  favorite:false},
  {id:'f09',name:'Blueberries',      servingSize:1,   unit:'cup',    calories:80,  carbs:19, fat:0,  protein:0,   category:'fruit',  favorite:false},
  {id:'f10',name:'Banana',           servingSize:1,   unit:'banana', calories:105, carbs:27, fat:0.3,protein:1.3, category:'fruit',  favorite:false},
  {id:'f11',name:'French Fries',     servingSize:79,  unit:'g',      calories:120, carbs:15, fat:6,  protein:1,   category:'carb',   favorite:false},
  {id:'f12',name:'Burger',           servingSize:1,   unit:'patty',  calories:380, carbs:0,  fat:30, protein:26,  category:'protein',favorite:false},
  {id:'f13',name:'Whey',             servingSize:2,   unit:'scoops', calories:160, carbs:13, fat:1,  protein:25,  category:'protein',favorite:false},
  {id:'f15',name:'Chicken Breast',   servingSize:170, unit:'g',      calories:280, carbs:0,  fat:6,  protein:53,  category:'protein',favorite:true},
  {id:'f16',name:'Beef Eye Roast',   servingSize:170, unit:'g',      calories:370, carbs:0,  fat:20, protein:46,  category:'protein',favorite:false},
  {id:'f17',name:'Lamb Leg',         servingSize:170, unit:'g',      calories:330, carbs:0,  fat:16, protein:45,  category:'protein',favorite:false},
  {id:'f18',name:'Ground Beef 85/15',servingSize:170, unit:'g',      calories:430, carbs:0,  fat:29, protein:40,  category:'protein',favorite:false},
  {id:'f19',name:'Strawberries',     servingSize:1,   unit:'cup',    calories:50,  carbs:12, fat:0,  protein:1,   category:'fruit',  favorite:false},
  {id:'f20',name:'Mango',            servingSize:1,   unit:'cup',    calories:100, carbs:25, fat:1,  protein:1,   category:'fruit',  favorite:false},

function save() {
  localStorage.setItem('fuelos_v2', JSON.stringify(S));
}

function load() {
  const raw = localStorage.getItem('fuelos_v2');
  if (raw) {
    try {
      const p = JSON.parse(raw);
      S = {...S, ...p};
      const storedFoodsVersion = S.foodsVersion || 1;
      S.foods = mergeDefaultFoods(S.foods);
      S.foodsVersion = FOODS_VERSION;
      if (storedFoodsVersion < FOODS_VERSION) {
        save();
      }
    } catch(e) {}
  } else {
    S.foods = mergeDefaultFoods([]);
    S.foodsVersion = FOODS_VERSION;
  }
  normalizeFoodCheckState();
  ensureRecompTemplates();
  ensureTodayPlanVisible();
  save();
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayStr() { return new Date().toISOString().slice(0,10); }

function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`;
}

function isToday(ds) { return ds === todayStr(); }

function prevDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function nextDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0,10);
}

function getOrCreateLog(date) {
  if (!S.logs[date]) {
    S.logs[date] = {
      meals: [
        {id:uid(), name:'Meal 1', eaten:true, foods:[]},
        {id:uid(), name:'Meal 2', eaten:true, foods:[]},
        {id:uid(), name:'Meal 3', eaten:true, foods:[]},
      ]
    };
    save();
  }
  return S.logs[date];
}

function makeFoodEntry(food, servings, eaten) {
  return {
    id: uid(),
    foodId: food.id,
    name: food.name,
    servingSize: food.servingSize,
    unit: food.unit,
    calories: food.calories,
    carbs: food.carbs,
    fat: food.fat,
    protein: food.protein,
    category: food.category,
    servings: servings || 1,
    eaten: eaten !== false,
  };
}

function mergeDefaultFoods(existingFoods) {
  const existing = Array.isArray(existingFoods) ? existingFoods : [];
  const byId = new Map(existing.map(f => [f.id, f]));
  const merged = existing.map(f => ({...f}));
  for(const df of DEFAULT_FOODS) {
    if(!byId.has(df.id)) {
      merged.push({...df});
    }
  }
  return merged;
}

function makePlanMeal(planMeal) {
  return {
    id: uid(),
    name: planMeal.name,
    eaten: false,
    foods: planMeal.foods.map(([foodId, servings]) => {
      const food = S.foods.find(f => f.id === foodId);
      return food ? makeFoodEntry(food, servings, false) : null;
    }).filter(Boolean),
  };
}

function makePlanTemplate(planMeal) {
  const meal = makePlanMeal(planMeal);
  return {
    id: `tpl-${planMeal.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}`,
    name: meal.name,
    foods: meal.foods.map(e => ({...e, id:uid()})),
  };
}

function logIsEmpty(log) {
  return !log || !Array.isArray(log.meals) || log.meals.every(m => !m.foods || m.foods.length === 0);
}

function ensureRecompTemplates() {
  if(!Array.isArray(S.templates)) S.templates = [];
  const existingNames = new Set(S.templates.map(t => t.name));
  for(const planMeal of RECOMP_DAY_PLAN) {
    if(!existingNames.has(planMeal.name)) {
      S.templates.push(makePlanTemplate(planMeal));
    }
  }
}

function ensureTodayPlanVisible() {
  const date = todayStr();
  const log = S.logs[date];
  if(!logIsEmpty(log)) return;
  S.logs[date] = {
    meals: RECOMP_DAY_PLAN.map(makePlanMeal),
  };
}

function normalizeFoodCheckState() {
  for(const log of Object.values(S.logs || {})) {
    if(!log || !Array.isArray(log.meals)) continue;
    for(const meal of log.meals) {
      if(!Array.isArray(meal.foods)) meal.foods = [];
      for(const entry of meal.foods) {
        if(typeof entry.eaten === 'undefined') {
          entry.eaten = meal.eaten !== false;
        }
      }
      syncMealEaten(meal);
    }
  }
}

function mealMacros(meal) {
  let c=0,p=0,cr=0,f=0;
  for(const e of meal.foods){
    c  += e.calories * e.servings;
    p  += e.protein  * e.servings;
    cr += e.carbs    * e.servings;
    f  += e.fat      * e.servings;
  }
  return {cal:Math.round(c),protein:Math.round(p),carbs:Math.round(cr),fat:Math.round(f)};
}

function sumMealsMacros(meals, includeMeal, includeEntry) {
  let c=0,p=0,cr=0,f=0;
  for(const m of meals){
    if(includeMeal && !includeMeal(m)) continue;
    for(const e of m.foods){
      if(includeEntry && !includeEntry(e, m)) continue;
      c  += e.calories * e.servings;
      p  += e.protein  * e.servings;
      cr += e.carbs    * e.servings;
      f  += e.fat      * e.servings;
    }
  }
  return {cal:Math.round(c),protein:Math.round(p),carbs:Math.round(cr),fat:Math.round(f)};
}

function dayMacros(date) {
  const log = S.logs[date];
  if(!log) return {cal:0,protein:0,carbs:0,fat:0};
  return sumMealsMacros(log.meals, null, entry => entry.eaten !== false);
}

function projectedDayMacros(date) {
  const log = S.logs[date];
  if(!log) return {cal:0,protein:0,carbs:0,fat:0};
  return sumMealsMacros(log.meals, meal => meal.foods.length > 0);
}

function evaluateQuests(date) {
  const log = S.logs[date];
  if(!log) return [];
  const m = dayMacros(date);
  const done = [];

  if(m.protein >= S.targets.protein) done.push('hitProtein');

  const mealsWithFood = log.meals.filter(ml => ml.foods.some(e => e.eaten !== false)).length;
  if(mealsWithFood >= 3) done.push('log3Meals');

  let fruitServings = 0;
  let carbFoodCarbs = 0;
  for(const meal of log.meals){
    for(const e of meal.foods){
      if(e.eaten === false) continue;
      if(e.category === 'fruit') fruitServings += e.servings;
      if(e.category === 'carb')  carbFoodCarbs += e.carbs * e.servings;
    }
  }
  if(fruitServings >= 2) done.push('eat2Fruits');
  if(m.cal >= S.targets.calories * 0.8 && m.cal <= S.targets.calories + 150) done.push('withinCalories');
  if(carbFoodCarbs >= 50) done.push('logWorkoutCarbs');

  return done;
}

function dayXP(date) {
  const done = evaluateQuests(date);
  return done.reduce((t,qid) => {
    const q = QUEST_DEFS.find(q => q.id === qid);
    return t + (q ? q.xp : 0);
  }, 0);
}

function totalXP() {
  return Object.keys(S.logs).reduce((t,d) => t + dayXP(d), 0);
}

function computeStreak() {
  let streak = 0;
  let d = todayStr();
  while(true) {
    const log = S.logs[d];
    const hasFood = log && log.meals.some(m => m.foods.some(e => e.eaten !== false));
    if(!hasFood) break;
    streak++;
    d = prevDate(d);
    if(streak > 3650) break;
  }
  return streak;
}

function getLevel(xp) {
  let lvl = LEVELS[0];
  for(const l of LEVELS) if(xp >= l.xpNeeded) lvl = l;
  return lvl;
}

function pct(val, max) {
  if(max === 0) return 0;
  return Math.min(100, Math.round(val / max * 100));
}

function barClass(val, max, type) {
  const p = val / max;
  if(p > 1.05) return type + ' over';
  return type;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmtNum(n) {
  const v = Math.round(n * 10) / 10;
  return Number.isInteger(v) ? String(v) : String(v);
}

function fmtAmount(size, unit) {
  return `${fmtNum(size)} ${unit}`.trim();
}

function fmtConsumedAmount(entry) {
  return fmtAmount(entry.servingSize * entry.servings, entry.unit);
}

function normalizeUnit(unit) {
  return String(unit || '').trim().toLowerCase();
}

function hasAmountUnit(unit) {
  return normalizeUnit(unit).length > 0;
}

function unitLabel(unit) {
  const u = normalizeUnit(unit);
  if(u === 'g' || u === 'gram' || u === 'grams') return 'g';
  if(u === 'ml' || u === 'milliliter' || u === 'milliliters') return 'ml';
  if(u === 'tbsp' || u === 'tablespoon' || u === 'tablespoons') return 'tbsp';
  if(u === 'tsp' || u === 'teaspoon' || u === 'teaspoons') return 'tsp';
  if(u === 'oz' || u === 'ounce' || u === 'ounces') return 'oz';
  return String(unit || '').trim();
}

function fmtInputAmount(entry) {
  if(hasAmountUnit(entry.unit) && entry.servingSize > 0) {
    return fmtNum(entry.servingSize * entry.servings);
  }
  return fmtNum(entry.servings);
}

function fmtInputHint(entry) {
  if(hasAmountUnit(entry.unit) && entry.servingSize > 0) {
    return `Enter ${unitLabel(entry.unit)}. Per serving: ${fmtAmount(entry.servingSize, entry.unit)}`;
  }
  return 'Servings';
}

function fmtAmountSideLabel(entry) {
  return `×${fmtNum(entry.servings)} srv`;
}

function checkedFoodsCount(log) {
  return log.meals.reduce((total, meal) => total + meal.foods.filter(e => e.eaten !== false).length, 0);
}

function plannedFoodsCount(log) {
  return log.meals.reduce((total, meal) => total + meal.foods.length, 0);
}

function mealCheckedState(meal) {
  if(meal.foods.length === 0) return 'empty';
  const checked = meal.foods.filter(e => e.eaten !== false).length;
  if(checked === 0) return 'none';
  if(checked === meal.foods.length) return 'all';
  return 'partial';
}

function syncMealEaten(meal) {
  meal.eaten = meal.foods.some(e => e.eaten !== false);
}

function tagHtml(cat) {
  const map = {protein:'tg-protein',carb:'tg-carb',fat:'tg-fat',fruit:'tg-fruit',dairy:'tg-dairy'};
  const cls = map[cat] || '';
  return `<span class="tag ${cls}">${esc(cat)}</span>`;
}

function macroBudgetRow(label, actual, projected, target, type, unit) {
  const actualPct = pct(actual, target);
  const projectedPct = pct(projected, target);
  const projectedOver = macroOver(projected, target, type) ? 'over' : '';
  const actualOver = macroOver(actual, target, type) ? 'over' : '';
  const suffix = unit || '';
  return `
    <div class="mrow">
      <div class="mlbl">${label}</div>
      <div class="mbg">
        <div class="mfill ${type} plan ${projectedOver}" style="width:${projectedPct}%"></div>
        <div class="mfill ${type} actual ${actualOver}" style="width:${actualPct}%"></div>
      </div>
      <div class="mval">${actual}${suffix} / ${projected}${suffix} / ${target}${suffix}</div>
    </div>`;
}

function macroOver(value, target, type) {
  if(type === 'cal') return value > target + 150;
  if(type === 'pro') return value > target * 1.3;
  return value > target * 1.1;
}

function toast(msg, col) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = col || 'var(--grn)';
  el.style.color = col || 'var(--grn)';
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2400);
}

function renderMealCard(meal, date) {

    : meal.foods.map(e => `
      <div class="fr ${e.eaten === false ? 'skipped' : ''}" data-eid="${e.id}">
        <button class="food-check ${e.eaten === false ? '' : 'on'}" title="${e.eaten === false ? 'Mark eaten' : 'Mark not eaten'}" onclick="toggleFoodEaten('${date}','${meal.id}','${e.id}')">${e.eaten === false ? '' : '✓'}</button>

          <input class="fsrv amt" type="number" min="0.1" step="any"
            value="${fmtInputAmount(e)}"
            title="${esc(fmtInputHint(e))}"
            onchange="updateServing('${date}','${meal.id}','${e.id}',this.value)"
            onblur="renderToday()">
          <span class="fqty-u" title="${esc(e.unit)}">${esc(unitLabel(e.unit))}</span>
        </div>
        <div class="funit" title="1 serving = ${esc(fmtAmount(e.servingSize, e.unit))}">${esc(fmtAmountSideLabel(e))}</div>
        <div class="fmac">
          <span class="fc">${Math.round(e.calories*e.servings)} cal</span>
          <span class="fp">${Math.round(e.protein*e.servings)}g P</span>
          <span>${Math.round(e.carbs*e.servings)}g C</span>
          <span>${Math.round(e.fat*e.servings)}g F</span>
        </div>
        <button class="food-remove" title="Remove" onclick="removeFoodFromMeal('${date}','${meal.id}','${e.id}')">✕</button>
      </div>
    `).join('');

  return `
  <div class="mc ${eaten?'eaten':'pending'} ${partial?'partial':''}" data-mid="${meal.id}">
    <div class="mch">
      <div class="mhead-left">
        <button class="meal-check ${eaten?'on':''}" title="${eaten?'Uncheck all foods':'Check all foods'}" onclick="toggleMealEaten('${date}','${meal.id}')">${eaten?'✓':partial?'~':''}</button>
        <input class="mname" value="${esc(meal.name)}"
          onchange="renameMeal('${date}','${meal.id}',this.value)"
          title="Click to rename">
      </div>
      <div class="msum">
        <span><span>${mm.cal}</span> cal</span>
        <span><span style="color:var(--blu)">${mm.protein}g</span> P</span>
        <span><span style="color:var(--org)">${mm.carbs}g</span> C</span>
        <span>${mm.fat}g F</span>
      </div>
      <div class="macts">
        <button class="btn btn-sm btn-g" onclick="openPickFood('${date}','${meal.id}')">+ FOOD</button>
        <details class="more-actions">
          <summary class="btn btn-sm">MORE</summary>
          <div class="more-menu">
            <button class="btn btn-sm" onclick="openLoadTpl('${meal.id}','${date}')">TPL</button>
            <button class="btn btn-sm" onclick="openSaveTemplate('${meal.id}','${date}')">SAVE</button>
            <button class="btn btn-sm" onclick="duplicateMeal('${date}','${meal.id}')">DUP</button>
            <button class="btn btn-sm btn-r" onclick="deleteMeal('${date}','${meal.id}')">DEL</button>
          </div>
        </details>
      </div>
    </div>
    <div class="mfl">${foodRows}</div>
  </div>`;
}

function renderFoods() {
  const q = (document.getElementById('food-search-inp') || {value:''}).value || '';

  if(q.trim()) {
    const lq = q.toLowerCase();
    foods = foods.filter(f => f.name.toLowerCase().includes(lq) || f.category.toLowerCase().includes(lq));
  }
  // sort: favorites first, then alpha
  foods = [...foods].sort((a,b) => {
    if(a.favorite !== b.favorite) return a.favorite ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  const rows = foods.map(f => `
    <tr>
      <td>
        <span class="star ${f.favorite?'on':''}" onclick="toggleFav('${f.id}')" title="Favorite">★</span>
      </td>
      <td class="na">${esc(f.name)}</td>
      <td>${tagHtml(f.category)}</td>
      <td style="color:var(--tx2)">${esc(fmtAmount(f.servingSize, f.unit))}</td>
      <td>${f.calories}</td>
      <td style="color:var(--blu)">${f.protein}g</td>
      <td style="color:var(--org)">${f.carbs}g</td>
      <td style="color:var(--pur)">${f.fat}g</td>

        <button class="btn btn-sm" onclick="openEditFood('${f.id}')">EDIT</button>
        <button class="btn btn-sm btn-r" onclick="confirmDeleteFood('${f.id}')">DEL</button>
      </td>
    </tr>
  `).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--tx2);padding:20px">No foods found</td></tr>`;

  document.getElementById('s-foods').innerHTML = `
  <div class="sbar" style="margin-bottom:12px">
    <input id="food-search-inp" class="sinp" placeholder="search foods by name or category…"
      value="${esc(q)}" oninput="renderFoods()" autocomplete="off">

    <button class="btn btn-g" onclick="openAddFood()">+ ADD FOOD</button>
  </div>
  <div class="panel" style="overflow-x:auto">
    <table class="ftbl">
      <thead><tr>
        <th>★</th><th>Name</th><th>Category</th><th>Serving</th>
        <th>Cal</th><th>Protein</th><th>Carbs</th><th>Fat</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  `;
}

══════════════════════════════════════════ */
function renderTemplates() {
  const cards = S.templates.length === 0
    ? `<div class="es">No templates saved yet.<br>Add foods to a meal then click SAVE to create a template.</div>`
    : S.templates.map(t => {
        const totalCal = t.foods.reduce((s,e) => s + e.calories * e.servings, 0);
        const totalPro = t.foods.reduce((s,e) => s + e.protein  * e.servings, 0);
        const totalCar = t.foods.reduce((s,e) => s + e.carbs    * e.servings, 0);
        const totalFat = t.foods.reduce((s,e) => s + e.fat      * e.servings, 0);
        const foodList = t.foods.map(e => `${e.name} ×${e.servings}`).join(', ');
        return `
        <div class="tcard">
          <div>
            <div class="tname">${esc(t.name)}</div>
            <div class="tsub">${Math.round(totalCal)} cal · ${Math.round(totalPro)}g P · ${Math.round(totalCar)}g C · ${Math.round(totalFat)}g F</div>

          </div>

            <button class="btn btn-sm btn-g" onclick="loadTemplateIntoMeal('${t.id}')">LOAD</button>
            <button class="btn btn-sm btn-r" onclick="confirmDeleteTemplate('${t.id}')">DEL</button>
          </div>
        </div>`;
      }).join('');

  document.getElementById('s-templates').innerHTML = `
  <div class="panel">
    <div class="ph"><span class="pt">SAVED TEMPLATES</span><span>${S.templates.length} SAVED</span></div>
    <div class="pb">${cards}</div>
  </div>`;
}

/* ══════════════════════════════════════════
   RENDER: PICK FOOD MODAL
══════════════════════════════════════════ */
function renderPickList() {
  const q = document.getElementById('pick-search').value.toLowerCase();
  let foods = S.foods;
  if(q) foods = foods.filter(f => f.name.toLowerCase().includes(q) || f.category.toLowerCase().includes(q));
  foods = [...foods].sort((a,b) => {
    if(a.favorite !== b.favorite) return a.favorite ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  // Favorites chips
  const favs = S.foods.filter(f => f.favorite);
  const favHtml = favs.length > 0 ? `
    <div style="margin-bottom:10px">
      <div style="font-size:9px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">★ Favorites</div>
      <div class="favrow">
        ${favs.map(f => `<button class="fchip" onclick="addFoodToMeal('${f.id}')">${esc(f.name)}</button>`).join('')}
      </div>
    </div>` : '';
  document.getElementById('pick-favs').innerHTML = favHtml;

  const rows = foods.map(f => `
    <div class="fr" style="cursor:pointer" onclick="addFoodToMeal('${f.id}')">
      <div class="fname">
        ${f.favorite ? '<span style="color:var(--org)">★</span> ' : ''}${esc(f.name)}
        ${tagHtml(f.category)}
      </div>
      <div class="fmac">
        <span class="fc">${f.calories} cal</span>
        <span class="fp">${f.protein}g P</span>
        <span>${f.carbs}g C</span>
        <span>${f.fat}g F</span>
      </div>
      <div class="funit" style="width:auto;font-size:10px;color:var(--tx2)">${esc(fmtAmount(f.servingSize, f.unit))}</div>
    </div>
  `).join('') || `<div class="es">No foods match</div>`;

  document.getElementById('pick-list').innerHTML = rows;
}

/* ══════════════════════════════════════════
   ACTIONS: DATE
══════════════════════════════════════════ */
function shiftDate(dir) {
  S.viewDate = dir < 0 ? prevDate(S.viewDate) : nextDate(S.viewDate);
  if(S.viewDate > todayStr()) S.viewDate = todayStr();
  renderToday();
  renderHeader();
}

function goToday() {
  S.viewDate = todayStr();
  renderToday();
  renderHeader();
}

/* ══════════════════════════════════════════
   ACTIONS: MEALS
══════════════════════════════════════════ */
function addMeal(date) {
  const log = getOrCreateLog(date);
  const n = log.meals.length + 1;
  log.meals.push({id:uid(), name:`Meal ${n}`, eaten:true, foods:[]});
  save();
  renderToday();
}

function loadRecompDay(date) {
  const log = getOrCreateLog(date);
  const hasFood = log.meals.some(m => m.foods.length > 0);
  const apply = () => {
    log.meals = RECOMP_DAY_PLAN.map(makePlanMeal);
    save();
    renderToday();
    renderHeader();
    toast('Recomp day loaded. Check meals off as you eat.');
  };
  if(hasFood) {
    confirm2('Replace this day with the 5-meal recomp plan?', 'REPLACE', apply);
  } else {
    apply();
  }
}

function toggleMealEaten(date, mealId) {
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  const checkAll = mealCheckedState(meal) !== 'all';
  meal.foods.forEach(e => { e.eaten = checkAll; });
  meal.eaten = checkAll;
  save();
  renderToday();
  renderHeader();
}

function deleteMeal(date, mealId) {
  confirm2('Delete this meal?', 'DELETE', () => {
    const log = S.logs[date];
    if(!log) return;
    log.meals = log.meals.filter(m => m.id !== mealId);
    save();
    renderToday();
    renderHeader();
  });
}

function duplicateMeal(date, mealId) {
  const log = getOrCreateLog(date);
  const src = log.meals.find(m => m.id === mealId);
  if(!src) return;
  const copy = {
    id: uid(),
    name: src.name + ' (copy)',
    eaten: src.eaten !== false,
    foods: src.foods.map(e => ({...e, id:uid()})),
  };
  log.meals.push(copy);
  save();
  renderToday();
  renderHeader();
  toast('Meal duplicated');
}

function renameMeal(date, mealId, name) {
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(meal) { meal.name = name; save(); }
}

function repeatYesterday(date) {
  const yd = prevDate(date);
  const ydLog = S.logs[yd];
  if(!ydLog || ydLog.meals.every(m => m.foods.length === 0)) {
    toast('No logged meals yesterday', 'var(--red)');
    return;
  }
  confirm2(`Copy all meals from ${fmtDate(yd)} to today?`, 'COPY', () => {
    const log = getOrCreateLog(date);
    log.meals = ydLog.meals.map(m => ({
      id: uid(),
      name: m.name,
      eaten: m.eaten !== false,
      foods: m.foods.map(e => ({...e, id:uid()})),
    }));
    save();
    renderToday();
    renderHeader();
    toast('Yesterday\'s meals copied ✓');
  });
}

/* ══════════════════════════════════════════
   ACTIONS: FOOD IN MEAL
══════════════════════════════════════════ */
function openPickFood(date, mealId) {
  _pickContext = {date, mealId};
  document.getElementById('pick-search').value = '';
  renderPickList();
  openModal('ov-pick');
  setTimeout(() => document.getElementById('pick-search').focus(), 100);
}

function addFoodToMeal(foodId) {
  if(!_pickContext) return;
  const {date, mealId} = _pickContext;
  const food = S.foods.find(f => f.id === foodId);
  if(!food) return;
  const log = getOrCreateLog(date);
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  meal.foods.push(makeFoodEntry(food, 1, meal.eaten !== false));
  syncMealEaten(meal);
  save();
  closeModal('ov-pick');
  renderToday();
  renderHeader();
}

function toggleFoodEaten(date, mealId, entryId) {
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  const entry = meal.foods.find(e => e.id === entryId);
  if(!entry) return;
  entry.eaten = entry.eaten === false;
  syncMealEaten(meal);
  save();
  renderToday();
  renderHeader();
}

function updateServing(date, mealId, entryId, val) {
  const v = parseFloat(val);
  if(isNaN(v) || v <= 0) return;
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  const entry = meal.foods.find(e => e.id === entryId);
  if(!entry) return;
  if(hasAmountUnit(entry.unit) && entry.servingSize > 0) {
    entry.servings = v / entry.servingSize;
  } else {
    entry.servings = v;
  }
  save();
}

function removeFoodFromMeal(date, mealId, entryId) {
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal) return;
  meal.foods = meal.foods.filter(e => e.id !== entryId);
  syncMealEaten(meal);
  save();
  renderToday();
  renderHeader();
}

/* ══════════════════════════════════════════
   ACTIONS: FOOD DATABASE — barcode scan + CRUD
══════════════════════════════════════════ */
let _barcodeScanner = null;
let _barcodeScanBusy = false;

function setScanStatus(msg, kind) {
  const el = document.getElementById('scan-status');
  if(!el) return;
  el.textContent = msg;
  el.className = 'scan-hint' + (kind ? ' ' + kind : '');
}

function parseServingSize(raw) {
  if(!raw) return {servingSize:100, unit:'g', grams:100};
  const s = String(raw).trim();
  const gramMatch = s.match(/(\d+\.?\d*)\s*g\b/i);
  if(gramMatch) {
    const g = parseFloat(gramMatch[1]);
    return {servingSize:g, unit:'g', grams:g};
  }
  const mlMatch = s.match(/(\d+\.?\d*)\s*ml\b/i);
  if(mlMatch) {
    const ml = parseFloat(mlMatch[1]);
    return {servingSize:ml, unit:'ml', grams:ml};
  }
  const numMatch = s.match(/^(\d+\.?\d*)/);
  if(numMatch) {
    const n = parseFloat(numMatch[1]);
    const unit = s.replace(/^\d+\.?\d*\s*/, '').replace(/\(.*\)/, '').trim() || 'serving';
    return {servingSize:n, unit, grams:null};
  }
  return {servingSize:1, unit:'serving', grams:null};
}

function guessFoodCategory(protein, carbs, fat) {
  const macroTotal = protein + carbs + fat;
  if(macroTotal <= 0) return 'other';
  if(protein / macroTotal >= 0.4 && protein >= 8) return 'protein';
  if(fat / macroTotal >= 0.45) return 'fat';
  if(carbs / macroTotal >= 0.45) return 'carb';
  return 'other';
}

function extractNutrients(n, servingGrams) {
  const round1 = v => Math.round(v * 10) / 10;
  if(n['energy-kcal_serving'] != null || n.proteins_serving != null) {
    return {
      calories: Math.round(n['energy-kcal_serving'] || 0),
      protein:  round1(n.proteins_serving || 0),
      carbs:    round1(n.carbohydrates_serving || 0),
      fat:      round1(n.fat_serving || 0),
    };
  }
  const grams = servingGrams || 100;
  const factor = grams / 100;
  return {
    calories: Math.round((n['energy-kcal_100g'] || 0) * factor),
    protein:  round1((n.proteins_100g || 0) * factor),
    carbs:    round1((n.carbohydrates_100g || 0) * factor),
    fat:      round1((n.fat_100g || 0) * factor),
  };
}

function mapOpenFoodFactsProduct(product) {
  const serving = parseServingSize(product.serving_size);
  const grams = serving.grams || (product.serving_quantity ? parseFloat(product.serving_quantity) : null);
  const macros = extractNutrients(product.nutriments || {}, grams);
  if(!macros.calories && !macros.protein && !macros.carbs && !macros.fat) {
    throw new Error('No nutrition data on this product — enter manually.');
  }
  return {
    name: (product.product_name || product.generic_name || 'Unknown product').trim(),
    category: guessFoodCategory(macros.protein, macros.carbs, macros.fat),
    servingSize: serving.servingSize,
    unit: serving.unit,
    ...macros,
  };
}

async function lookupOpenFoodFacts(barcode) {
  const code = String(barcode).replace(/\D/g, '');
  if(code.length < 8) throw new Error('Invalid barcode.');
  const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,generic_name,serving_size,serving_quantity,nutriments`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Lookup failed — check your connection.');
  const data = await res.json();
  if(data.status !== 1 || !data.product) throw new Error('Product not found in Open Food Facts.');
  return mapOpenFoodFactsProduct(data.product);
}

async function stopBarcodeScanner() {
  if(!_barcodeScanner) return;
  const scanner = _barcodeScanner;
  _barcodeScanner = null;
  try {
    if(scanner.isScanning && scanner.isScanning()) await scanner.stop();
    scanner.clear();
  } catch { /* camera may already be released */ }
}

async function startBarcodeScanner() {
  if(typeof Html5Qrcode === 'undefined') {
    setScanStatus('Scanner library failed to load.', 'err');
    return;
  }
  await stopBarcodeScanner();
  _barcodeScanner = new Html5Qrcode('barcode-reader');
  const config = {
    fps: 10,
    qrbox: (w, h) => ({width: Math.min(w * 0.92, 320), height: Math.min(h * 0.45, 140)}),
    aspectRatio: 1.333,
  };
  try {
    await _barcodeScanner.start(
      {facingMode: 'environment'},
      config,
      decoded => handleBarcodeDetected(decoded),
      () => {}
    );
  } catch {
    setScanStatus('Camera access denied or unavailable. Enter barcode manually below.', 'err');
  }
}

async function handleBarcodeDetected(code) {
  if(_barcodeScanBusy) return;
  _barcodeScanBusy = true;
  const barcode = String(code).replace(/\D/g, '');
  if(barcode.length < 8) { _barcodeScanBusy = false; return; }
  setScanStatus('Looking up ' + barcode + '…', 'loading');
  await stopBarcodeScanner();
  try {
    const food = await lookupOpenFoodFacts(barcode);
    fillFoodFormFromScan(food);
    closeModal('ov-barcode-scanner');
    toast('Product found — review & save ✓');
  } catch (err) {
    setScanStatus(err.message || 'Product not found.', 'err');
    _barcodeScanBusy = false;
    startBarcodeScanner();
  }
}

function lookupManualBarcode() {
  const code = document.getElementById('barcode-manual').value.replace(/\D/g, '');
  if(code.length < 8) { toast('Enter a valid barcode (8+ digits)', 'var(--red)'); return; }
  handleBarcodeDetected(code);
}

function fillFoodFormFromScan(food) {

  document.getElementById('ff-srv').value  = food.servingSize;
  document.getElementById('ff-unit').value = food.unit;
  document.getElementById('ff-cal').value  = food.calories;
  document.getElementById('ff-pro').value  = food.protein;
  document.getElementById('ff-car').value  = food.carbs;
  document.getElementById('ff-fat').value  = food.fat;
  openModal('ov-food-form');
  setTimeout(() => document.getElementById('ff-name').focus(), 100);
}

function openBarcodeScanner() {
  closeModal('ov-food-form');
  _barcodeScanBusy = false;
  document.getElementById('barcode-manual').value = '';

function closeBarcodeScanner() {

}

function openAddFood() {

function submitFoodForm() {
  const name = document.getElementById('ff-name').value.trim();
  if(!name) { toast('Name is required', 'var(--red)'); return; }
  const food = {
    name,
    category:    document.getElementById('ff-cat').value,
    servingSize: parseFloat(document.getElementById('ff-srv').value) || 1,
    unit:        document.getElementById('ff-unit').value.trim() || 'g',
    calories:    parseFloat(document.getElementById('ff-cal').value) || 0,
    protein:     parseFloat(document.getElementById('ff-pro').value) || 0,
    carbs:       parseFloat(document.getElementById('ff-car').value) || 0,
    fat:         parseFloat(document.getElementById('ff-fat').value) || 0,
  };
  if(_editFoodId) {
    const idx = S.foods.findIndex(f => f.id === _editFoodId);
    if(idx !== -1) S.foods[idx] = {...S.foods[idx], ...food};
    toast('Food updated ✓');
  } else {
    S.foods.push({id:uid(), favorite:false, ...food});
    toast('Food added ✓');
  }
  save();
  closeModal('ov-food-form');
  renderFoods();
}

function confirmDeleteFood(foodId) {
  const f = S.foods.find(f => f.id === foodId);
  if(!f) return;
  confirm2(`Delete "${f.name}" from database?`, 'DELETE', () => {
    S.foods = S.foods.filter(f => f.id !== foodId);
    save();
    renderFoods();
    toast('Food deleted');
  });
}

function toggleFav(foodId) {
  const f = S.foods.find(f => f.id === foodId);
  if(!f) return;
  f.favorite = !f.favorite;
  save();
  renderFoods();
}

function openSaveTemplate(mealId, date) {
  const log = S.logs[date];
  if(!log) return;
  const meal = log.meals.find(m => m.id === mealId);
  if(!meal || meal.foods.length === 0) { toast('Add foods first', 'var(--red)'); return; }
  _tplMealId = mealId;
  _tplDate   = date;
  document.getElementById('tpl-name').value = meal.name;
  openModal('ov-tpl');
  setTimeout(() => document.getElementById('tpl-name').focus(), 100);
}

let _tplDate = null;

function submitSaveTemplate() {
  const name = document.getElementById('tpl-name').value.trim();
  if(!name) { toast('Name required', 'var(--red)'); return; }
  const log  = S.logs[_tplDate];
  if(!log) return;
  const meal = log.meals.find(m => m.id === _tplMealId);
  if(!meal) return;
  S.templates.push({
    id: uid(),
    name,
    foods: meal.foods.map(e => ({...e, id:uid()})),
  });
  save();
  closeModal('ov-tpl');
  toast('Template saved ✓');
  renderTemplates();
}

function openLoadTpl(mealId, date) {
  _loadTplMealId  = mealId;
  _loadTplDate    = date;
  renderLoadTplModal();
  openModal('ov-load-tpl');
}

let _loadTplDate = null;

function applyTemplate(tplId) {
  const tpl = S.templates.find(t => t.id === tplId);
  if(!tpl) return;
  const log  = getOrCreateLog(_loadTplDate);
  const meal = log.meals.find(m => m.id === _loadTplMealId);
  if(!meal) return;
  meal.foods = [...meal.foods, ...tpl.foods.map(e => ({...e, id:uid(), eaten: meal.eaten !== false}))];
  syncMealEaten(meal);
  save();
  closeModal('ov-load-tpl');
  renderToday();
  renderHeader();
  toast(`Loaded "${tpl.name}" ✓`);
}

function loadTemplateIntoMeal(tplId) {
  const date = S.viewDate;
  const log  = getOrCreateLog(date);
  if(log.meals.length === 0) {
    addMeal(date);
  }
  _loadTplMealId = null;
  _loadTplDate   = date;
  const tpl = S.templates.find(t => t.id === tplId);
  if(!tpl) return;
  // load into first meal or ask
  const mealId = log.meals[0].id;
  _loadTplMealId = mealId;
  applyTemplate(tplId);
}

function confirmDeleteTemplate(tplId) {
  const t = S.templates.find(t => t.id === tplId);
  if(!t) return;
  confirm2(`Delete template "${t.name}"?`, 'DELETE', () => {
    S.templates = S.templates.filter(t => t.id !== tplId);
    save();
    renderTemplates();
    toast('Template deleted');
  });
}

/* ══════════════════════════════════════════
   ACTIONS: SETTINGS
══════════════════════════════════════════ */
function updateTarget(key, val) {
  const v = parseFloat(val);
  if(!isNaN(v) && v >= 0) { S.targets[key] = v; save(); }
}

function confirmResetAll() {
  confirm2('This will delete ALL logs, templates, and foods. Are you sure?', 'RESET', () => {
    localStorage.removeItem('fuelos_v2');
    location.reload();
  });
}

/* ══════════════════════════════════════════
   IMPORT / EXPORT
══════════════════════════════════════════ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `fuelos-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exported ✓');
}

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(data.foods && data.logs) {
          S = {...S, ...data};
          S.foods = mergeDefaultFoods(S.foods);
          normalizeFoodCheckState();
          save();
          renderAll();
          toast('Backup imported ✓');
        } else {
          toast('Invalid backup file', 'var(--red)');
        }
      } catch { toast('Failed to parse file', 'var(--red)'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}

function exportCSV() {
  const rows = [['Date','Meal','Meal Eaten','Food','Food Eaten','Servings','Unit','Calories','Protein','Carbs','Fat']];
  for(const [date, log] of Object.entries(S.logs)) {
    for(const meal of log.meals) {
      for(const e of meal.foods) {
        rows.push([
          date, meal.name, mealCheckedState(meal) === 'all' ? 'yes' : mealCheckedState(meal) === 'partial' ? 'partial' : 'no',
          e.name, e.eaten !== false ? 'yes' : 'no', e.servings, e.unit,
          Math.round(e.calories*e.servings),
          Math.round(e.protein*e.servings),
          Math.round(e.carbs*e.servings),
          Math.round(e.fat*e.servings),
        ]);
      }
    }
  }
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `fuelos-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported ✓');
}

/* ══════════════════════════════════════════
   MODAL HELPERS
══════════════════════════════════════════ */
function openModal(id) {
  document.getElementById(id).classList.add('on');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('on');
}

function confirm2(msg, label, cb) {
  document.getElementById('conf-title').textContent = 'CONFIRM';
  document.getElementById('conf-msg').textContent = msg;
  const btn = document.getElementById('conf-ok');
  btn.textContent = label || 'CONFIRM';
  btn.onclick = () => { closeModal('ov-confirm'); cb(); };
  openModal('ov-confirm');
}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
function renderAll() {
  renderHeader();
  const activeScreen = document.querySelector('.screen.on');
  const sid = activeScreen ? activeScreen.id : 's-today';
  if(sid === 's-today')     renderToday();
  if(sid === 's-foods')     renderFoods();
  if(sid === 's-templates') renderTemplates();
  if(sid === 's-settings')  renderSettings();
}

document.querySelectorAll('.nb').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    btn.classList.add('on');
    const sid = 's-' + btn.dataset.s;
    document.getElementById(sid).classList.add('on');
    if(btn.dataset.s === 'today')     renderToday();
    if(btn.dataset.s === 'foods')     renderFoods();
    if(btn.dataset.s === 'templates') renderTemplates();
    if(btn.dataset.s === 'settings')  renderSettings();
  });
});

// Close modals on overlay click
document.querySelectorAll('.ov').forEach(ov => {
  ov.addEventListener('click', e => {
    if(e.target === ov) ov.classList.remove('on');
  });
});

// Close modals on Escape
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    document.querySelectorAll('.ov.on').forEach(ov => ov.classList.remove('on'));
  }
});

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
load();
renderHeader();
renderToday();
</script>
