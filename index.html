<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=meal-planner.html">
<title>FUEL OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090b;
  --fuel: #f59e0b;
  --tx3: #eef2f8;
  --tx2: #5c6678;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--tx2);
  font-family: 'DM Sans', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(245,158,11,0.1), transparent 55%);
}
.card {
  position: relative;
  text-align: center;
  padding: 48px 40px;
  animation: in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes in {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--fuel), #d97706);
  color: #0a0a0a;
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  box-shadow: 0 0 32px rgba(245, 158, 11, 0.35);
  margin-bottom: 20px;
}
h1 {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  color: var(--tx3);
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}
p { font-size: 14px; margin-bottom: 24px; }
a {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  padding: 12px 24px;
  border-radius: 999px;
  background: linear-gradient(180deg, #fbbf24, var(--fuel));
  color: #0a0a0a;
  text-decoration: none;
  box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
  transition: transform 0.15s;
}
a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="card">
  <div class="mark">F</div>
  <h1>Fuel OS</h1>
  <p>Opening meal planner…</p>
  <a href="meal-planner.html">Open now</a>
</div>
</body>
</html>
